rn { color: var(--warn); }\n.viz { display: grid; grid-template-columns: 1fr 230px; gap: 16px; align-items: start; }\n@media (max-width: 700px) { .viz { grid-template-columns: 1fr; } }\ncanvas.tall { height: 560px; }\ncanvas.mid { height: 230px; }\n.readout { font-variant-numeric: tabular-nums; }\n.readout div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }\n.readout div:first-child { border-top: 0; }\n.readout span:first-child { color: var(--muted); }\n.readout b { font-weight: 600; text-align: right; }\n.controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }\n.controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }\n.controls select { width: auto; }\n.sched-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }\ntable.sched { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }\ntable.sched th, table.sched td { padding: 6px 10px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }\ntable.sched th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; }\ntable.sched td:first-child, table.sched th:first-child { text-align: left; }\ntable.sched .alt { color: var(--muted); }\n.legend i.sq { width: 14px; height: 14px; border: 0; border-radius: 3px; vertical-align: -2px; }\n\n[hidden] { display: none !important; }\n\n.grid > * { min-width: 0; }\n.viz > * { min-width: 0; }\n\n.fluid-head { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }\n.fluid-head span { font-weight: 400; color: var(--muted); font-size: 12.5px; }\n.sec-table select { width: 100%; padding: 6px 2px; }\n\n/* ---- wide dashboard layout ---- */\n.wrap.wide { max-width: none; padding: 14px 20px 40px; }\n.wrap.wide h1 { font-size: 20px; }\n.lead.compact { margin: 0 0 14px; max-width: 1100px; font-size: 14px; }\n.dash { grid-template-columns: 350px minmax(0, 1fr); }\n.dash > form { position: sticky; top: 66px; max-height: calc(100vh - 82px); overflow-y: auto; }\n.stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start;\n  grid-template-areas: \"res res\" \"viz viz\" \"hyd chart\" \"sched sched\"; }\n.stack > .panel { margin: 0; min-width: 0; }\n.sec-res { grid-area: res; } .sec-viz { grid-area: viz; } .sec-hyd { grid-area: hyd; } .sec-chart { grid-area: chart; } .sec-sched { grid-area: sched; }\n.rescols { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(320px, 1.5fr); gap: 8px 32px; align-items: start; }\n.rescols table.res { margin-top: 0; }\n.viz.big { grid-template-columns: minmax(0, 1fr) 270px; }\n.viz.big canvas.tall { height: clamp(560px, 76vh, 980px); }\n.controls.inline { margin-top: 0; }\n.vleg { flex-direction: column; flex-wrap: nowrap; gap: 7px; margin-top: 16px; }\n.vleg span { display: flex; align-items: center; gap: 6px; }\n.wrap.wide canvas#chart { height: clamp(440px, 66vh, 780px); }\n@media (max-width: 1250px) { .stack { grid-template-areas: \"res res\" \"viz viz\" \"hyd hyd\" \"chart chart\" \"sched sched\"; } }\n@media (max-width: 1000px) {\n  .dash { grid-template-columns: 1fr; }\n  .dash > form { position: static; max-height: none; }\n  .stack { grid-template-columns: 1fr; grid-template-areas: \"res\" \"viz\" \"hyd\" \"chart\" \"sched\"; }\n  .rescols { grid-template-columns: 1fr; }\n  .viz.big { grid-template-columns: 1fr; }\n}\n\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n  <a class=\"brand\" href=\"#index\">Well<span>Tools<\/span><\/a>\n  <nav class=\"nav\">\n    <a class=\"active\" href=\"#gaslift\">Газлифт: глубина посадки<\/a>\n    <a href=\"#displacement\">Замещение затрубного пространства<\/a>\n  <\/nav>\n<\/header>\n\n<main class=\"wrap wide\">\n  <h1>Оптимальная глубина посадки газлифтовой мандрели<\/h1>\n  <p class=\"lead\">Давление газлифта в затрубе на глубине ГЛМ должно быть больше гидростатики жидкости заканчивания плюс давления в выкидной линии (давления системы). Все давления — избыточные.<\/p>\n\n  <div class=\"grid\">\n    <form class=\"panel\" id=\"form\" autocomplete=\"off\" onsubmit=\"return false\">\n      <h2>Объект<\/h2>\n      <div class=\"field\">\n        <label for=\"obj\">Платформа<\/label>\n        <div class=\"inp\"><select id=\"obj\" style=\"width:100%\"><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pGas\">Макс. давление газлифта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pGas\" class=\"has-unit\" data-p step=\"any\"><select data-pu=\"pGas\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Задаётся объектом, можно изменить вручную.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pSys\">Давление системы (выкидная линия)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pSys\" class=\"has-unit\" data-p step=\"any\"><select data-pu=\"pSys\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\" id=\"sysHint\">Временное значение, будет уточнено.<\/div>\n      <\/div>\n\n      <h2>Жидкость заканчивания<\/h2>\n      <div class=\"field\">\n        <label for=\"rho\">Плотность<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"rho\" value=\"8.6\" step=\"0.01\"><span class=\"unit\">ppg<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"dP\">Запас давления<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dP\" class=\"has-unit\" data-p value=\"0\" step=\"any\"><select data-pu=\"dP\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Необязательно. Сколько давления газа должно остаться сверх необходимого.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"dMax\">Макс. глубина ГЛМ (TVD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dMax\" step=\"any\" placeholder=\"без ограничения\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">Необязательно: пакер, перфорация и т.п.<\/div>\n      <\/div>\n\n      <h2>Газ и температура<\/h2>\n      <div class=\"field\">\n        <label for=\"gg\">Отн. плотность газа (воздух = 1)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"gg\" value=\"0.70\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"z\">Коэффициент сверхсжимаемости Z<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"z\" value=\"0.90\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"ts\">Температура на устье<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"ts\" value=\"20\" step=\"any\"><span class=\"unit\">°C<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"tg\">Геотермический градиент<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"tg\" value=\"3\" step=\"0.1\"><span class=\"unit\">°C/100 м<\/span><\/div>\n      <\/div>\n\n      <h2>Установленные мандрели (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"mand\">Глубины по TVD, м<\/label>\n        <div class=\"inp\"><input type=\"text\" id=\"mand\" placeholder=\"например 600, 1100, 1550\"><\/div>\n        <div class=\"hint\">Через запятую. Подберём ближайшую не глубже расчётной.<\/div>\n      <\/div>\n    <\/form>\n\n    <div>\n      <section class=\"panel\" aria-live=\"polite\">\n        <h2>Результат<\/h2>\n        <div class=\"hero\">\n          <div class=\"big\" id=\"depth\">—<\/div>\n          <span class=\"badge\" id=\"badge\"><\/span>\n        <\/div>\n        <p class=\"note\" id=\"note\"><\/p>\n        <table class=\"res\" id=\"table\"><\/table>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"chart-head\">\n          <h2>Давления по глубине<\/h2>\n          <div class=\"seg\" id=\"chartUnit\"><button data-u=\"psi\" class=\"on\">psi<\/button><button data-u=\"кПа\">кПа<\/button><\/div>\n        <\/div>\n        <canvas id=\"chart\"><\/canvas>\n        <div class=\"legend\">\n          <span><i style=\"border-color:var(--c-casing)\"><\/i>Давление газлифта в затрубе<\/span>\n          <span><i style=\"border-color:var(--c-tubing)\"><\/i>Гидростатика жидкости + давление системы<\/span>\n        <\/div>\n        <details class=\"method\">\n          <summary>Как считается<\/summary>\n          <p>Давление газа на глубине D: <code>Pг = Pгл · exp(0,03415·γг·D / (Z·T))<\/code>, интегрируется по участкам с ростом температуры (T в К, давление абсолютное).<\/p>\n          <p>Противодавление: <code>Pж = Pсист + Gж·D<\/code>, где Gж — гидростатический градиент жидкости заканчивания (0,052·ρ[ppg] psi/ft).<\/p>\n          <p>Глубина ГЛМ — наибольшая D, при которой <code>Pг(D) &gt; Pж(D) + запас<\/code>. Глубже газ уже не сможет вытеснить жидкость.<\/p>\n        <\/details>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\n/* Объекты: максимальное давление газлифта и давление системы (выкидная линия / сепаратор), psi.\n * ВАЖНО: pSystemPsi — временные значения (1000 psi), ждут уточнения от инженера. */\nwindow.GL_OBJECTS = [\n  { id: 'berkut', name: 'МСП Беркут',  pGasMaxPsi: 3000, pSystemPsi: 1000 },\n  { id: 'odoptu', name: 'БКП Одопту',  pGasMaxPsi: 2500, pSystemPsi: 1000 },\n  { id: 'orlan',  name: 'МСП Орлан',   pGasMaxPsi: 2900, pSystemPsi: 1000 }\n];\n\n<\/script>\n<script>\n/* Расчётное ядро: максимальная глубина посадки газлифтовой мандрели (ГЛМ).\n *\n * Условие: давление газлифта в затрубе на глубине ГЛМ должно быть больше\n *   гидростатики жидкости заканчивания + давления системы (выкидная линия / сепаратор):\n *     Pг(D) > Pсист + Gж·D (+ запас)\n *   Pг(D) = Pгл · exp(0,03415·γг·D / (Z·T))  — по участкам, T(z) линейна; давления избыточные, расчёт в кПа.\n * Результат — наибольшая D, при которой условие выполняется (не глубже dMax, если задан).\n */\n(function (root) {\n  'use strict';\n\n  var PSI = 6.894757;          // кПа в 1 psi\n  var ATM = 101.325;           // кПа\n  var PPG_TO_KPA_M = 1.17512;  // 1 ppg → кПа/м\n\n  function calc(p) {\n    var Gl = PPG_TO_KPA_M * p.rho;\n\n    function gasP(D) {\n      if (D <= 0) return p.pGas;\n      var n = Math.max(1, Math.ceil(D / 5)), dz = D / n, P = p.pGas + ATM;\n      for (var i = 0; i < n; i++) {\n        var T = 273.15 + p.ts + p.tg * ((i + 0.5) * dz) / 100;\n        P *= Math.exp(0.03415 * p.gg * dz / (p.z * T));\n      }\n      return P - ATM;\n    }\n    function liqP(D) { return p.pSys + Gl * D; }          // давление столба жидкости + система\n    function margin(D) { return gasP(D) - liqP(D) - p.dP; } // >0 — условие выполняется\n\n    var res = { Gl: Gl, gasP: gasP, liqP: liqP, margin: margin, limited: false };\n\n    if (margin(0) <= 0) { res.status = 'none'; res.depth = null; return res; }\n\n    var hi = (p.pGas - p.pSys) / (0.5 * Gl) + 10;   // заведомо глубже корня (газ втрое легче жидкости и более)\n    var limit = isFinite(p.dMax) && p.dMax > 0 ? p.dMax : null;\n    if (limit !== null && margin(limit) > 0) {\n      res.status = 'limited'; res.depth = limit; res.limited = true;\n    } else {\n      var lo = 0;\n      if (limit !== null) hi = Math.min(hi, limit);\n      for (var i = 0; i < 80; i++) {\n        var mid = (lo + hi) / 2;\n        if (margin(mid) > 0) lo = mid; else hi = mid;\n      }\n      res.status = 'ok'; res.depth = lo;\n    }\n\n    var D = res.depth;\n    res.pGasAt = gasP(D);\n    res.pHydro = Gl * D;\n    res.pLiqAt = liqP(D);\n    res.gasGrad = (gasP(D + 1) - gasP(Math.max(D - 1, 0))) / (D > 0 ? 2 : 1);\n\n    if (limit !== null) {   // какое давление ГЛ нужно, чтобы дойти до заданной глубины\n      var F = (gasP(limit) + ATM) / (p.pGas + ATM);\n      res.pGasRequired = (liqP(limit) + p.dP + ATM) / F - ATM;\n    }\n    return res;\n  }\n\n  /* из установленных мандрелей — глубочайшая, не глубже расчётной */\n  function pickMandrel(list, depth) {\n    var s = list.slice().sort(function (a, b) { return a - b; }), best = null, next = null;\n    for (var i = 0; i < s.length; i++) {\n      if (s[i] <= depth + 1e-9) best = s[i]; else { next = s[i]; break; }\n    }\n    return { best: best, next: next };\n  }\n\n  var api = { calc: calc, pickMandrel: pickMandrel, PSI: PSI, ATM: ATM };\n  if (typeof module !== 'undefined' && module.exports) module.exports = api;\n  else root.GLEngine = api;\n})(this);\n\n<\/script>\n<script>\n(function () {\n  'use strict';\n  var E = window.GLEngine, OBJ = window.GL_OBJECTS;\n  var PSI = E.PSI;\n  var $ = function (id) { return document.getElementById(id); };\n  var chartUnit = 'psi';\n  var last = null;\n\n  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });\n  var nf3 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 3 });\n\n  function unitOf(id) { var s = document.querySelector('select[data-pu=\"' + id + '\"]'); return s ? s.value : 'psi'; }\n  function toKPa(v, u) { return u === 'psi' ? v * PSI : v; }\n  function fromKPa(v, u) { return u === 'psi' ? v / PSI : v; }\n  function pBoth(kpa) { return nf0.format(kpa / PSI) + ' psi <span class=\"alt\">' + nf0.format(kpa) + ' кПа<\/span>'; }\n  function num(id) { return parseFloat($(id).value); }\n  function fmtIn(kpa, u) { var v = fromKPa(kpa, u); return u === 'psi' ? Math.round(v * 100) / 100 : Math.round(v); }\n\n  /* выбор объекта */\n  var objSel = $('obj');\n  OBJ.forEach(function (o) { var op = document.createElement('option'); op.value = o.id; op.textContent = o.name; objSel.appendChild(op); });\n\n  function applyObject() {\n    var o = OBJ.filter(function (x) { return x.id === objSel.value; })[0];\n    $('pGas').value = fmtIn(o.pGasMaxPsi * PSI, unitOf('pGas'));\n    $('pSys').value = fmtIn(o.pSystemPsi * PSI, unitOf('pSys'));\n  }\n  objSel.addEventListener('change', function () { applyObject(); run(); });\n\n  /* смена единицы: физическое значение остаётся тем же tom: 8px; }\n.chart-head h2 { margin: 0 !important; }\ncanvas { width: 100%; height: 440px; display: block; }\n.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }\n.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }\n.legend i.dash { border-top-style: dashed; }\ndetails.method { margin-top: 16px; font-size: 13.5px; color: var(--muted); }\ndetails.method summary { cursor: pointer; color: var(--ink); }\ndetails.method code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }\n\n/* ---- displacement module ---- */\n:root { --c-gas: #d97706; --c-brine: #0b6e99; --c-brine-soft: #a9cfe0; }\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --c-gas: #f5a524; --c-brine: #5ab6dc; --c-brine-soft: #2c4b5a; }\n}\n.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 14px; border-radius: 6px; font: inherit; font-size: 13.5px; cursor: pointer; }\n.btn:hover { border-color: var(--accent); }\n.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }\n.btn.small { padding: 3px 9px; font-size: 12.5px; }\n.sec-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 13px; }\n.sec-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 0 4px 4px 0; }\n.sec-table td { padding: 0 4px 4px 0; }\n.sec-table td:last-child { width: 28px; text-align: right; }\ntextarea { width: 100%; min-height: 110px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 12.5px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }\ntextarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }\n.msg { font-size: 12.5px; margin: 6px 0 0; color: var(--muted); }\n.msg.bad { color: var(--bad); }\n.msg.warn { color: var(--warn); }\n.viz { display: grid; grid-template-columns: 1fr 230px; gap: 16px; align-items: start; }\n@media (max-width: 700px) { .viz { grid-template-columns: 1fr; } }\ncanvas.tall { height: 560px; }\ncanvas.mid { height: 230px; }\n.readout { font-variant-numeric: tabular-nums; }\n.readout div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }\n.readout div:first-child { border-top: 0; }\n.readout span:first-child { color: var(--muted); }\n.readout b { font-weight: 600; text-align: right; }\n.controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }\n.controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }\n.controls select { width: auto; }\n.sched-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }\ntable.sched { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }\ntable.sched th, table.sched td { padding: 6px 10px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }\ntable.sched th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; }\ntable.sched td:first-child, table.sched th:first-child { text-align: left; }\ntable.sched .alt { color: var(--muted); }\n.legend i.sq { width: 14px; height: 14px; border: 0; border-radius: 3px; vertical-align: -2px; }\n\n[hidden] { display: none !important; }\n\n.grid > * { min-width: 0; }\n.viz > * { min-width: 0; }\n\n.fluid-head { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }\n.fluid-head span { font-weight: 400; color: var(--muted); font-size: 12.5px; }\n.sec-table select { width: 100%; padding: 6px 2px; }\n\n/* ---- wide dashboard layout ---- */\n.wrap.wide { max-width: none; padding: 14px 20px 40px; }\n.wrap.wide h1 { font-size: 20px; }\n.lead.compact { margin: 0 0 14px; max-width: 1100px; font-size: 14px; }\n.dash { grid-template-columns: 350px minmax(0, 1fr); }\n.dash > form { position: sticky; top: 66px; max-height: calc(100vh - 82px); overflow-y: auto; }\n.stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start;\n  grid-template-areas: \"res res\" \"viz viz\" \"hyd chart\" \"sched sched\"; }\n.stack > .panel { margin: 0; min-width: 0; }\n.sec-res { grid-area: res; } .sec-viz { grid-area: viz; } .sec-hyd { grid-area: hyd; } .sec-chart { grid-area: chart; } .sec-sched { grid-area: sched; }\n.rescols { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(320px, 1.5fr); gap: 8px 32px; align-items: start; }\n.rescols table.res { margin-top: 0; }\n.viz.big { grid-template-columns: minmax(0, 1fr) 270px; }\n.viz.big canvas.tall { height: clamp(560px, 76vh, 980px); }\n.controls.inline { margin-top: 0; }\n.vleg { flex-direction: column; flex-wrap: nowrap; gap: 7px; margin-top: 16px; }\n.vleg span { display: flex; align-items: center; gap: 6px; }\n.wrap.wide canvas#chart { height: clamp(440px, 66vh, 780px); }\n@media (max-width: 1250px) { .stack { grid-template-areas: \"res res\" \"viz viz\" \"hyd hyd\" \"chart chart\" \"sched sched\"; } }\n@media (max-width: 1000px) {\n  .dash { grid-template-columns: 1fr; }\n  .dash > form { position: static; max-height: none; }\n  .stack { grid-template-columns: 1fr; grid-template-areas: \"res\" \"viz\" \"hyd\" \"chart\" \"sched\"; }\n  .rescols { grid-template-columns: 1fr; }\n  .viz.big { grid-template-columns: 1fr; }\n}\n\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n  <a class=\"brand\" href=\"#index\">Well<span>Tools<\/span><\/a>\n  <nav class=\"nav\">\n    <a href=\"#gaslift\">Газлифт: глубина посадки<\/a>\n    <a class=\"active\" href=\"#displacement\">Замещение затрубного пространства<\/a>\n  <\/nav>\n<\/header>\n\n<main class=\"wrap wide\">\n  <h1>Замещение затрубного пространства<\/h1>\n  <p class=\"lead compact\">Газ из затруба постепенно вытесняет рассол через ГЛ клапан в НКТ. Расход рассола через клапан не должен превышать заданный предел (1 ббл/мин). Считаем ступенчатый график давления на устье по времени. Все давления — избыточные.<\/p>\n\n  <div class=\"grid dash\">\n    <form class=\"panel\" id=\"form\" autocomplete=\"off\" onsubmit=\"return false\">\n      <h2>Режим расчёта<\/h2>\n      <div class=\"field\">\n        <label for=\"mode\">Физика<\/label>\n        <div class=\"inp\"><select id=\"mode\" style=\"width:100%\"><option value=\"simple\">Упрощённая<\/option><option value=\"adv\">Сложная физика<\/option><\/select><\/div>\n        <div class=\"hint\" data-simple>Гидростатика с постоянным Z, без трения; газ в НКТ учитывается через плотность жидкости.<\/div>\n        <div class=\"hint\" data-adv hidden>Реальный Z газа, плотность рассола от температуры, трение в затрубе и НКТ, многофазный поток в НКТ (модель дрейфа) с утечкой газа через клапан. Считается дольше.<\/div>\n      <\/div>\n\n      <h2>Объект<\/h2>\n      <div class=\"field\">\n        <label for=\"obj\">Платформа<\/label>\n        <div class=\"inp\"><select id=\"obj\" style=\"width:100%\"><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pMax\">Макс. давление газлифта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pMax\" class=\"has-unit\" step=\"any\"><select data-pu=\"pMax\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pSys\">Давление системы (выкидная линия)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pSys\" class=\"has-unit\" step=\"any\"><select data-pu=\"pSys\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Берётся из объекта (пока временное значение).<\/div>\n      <\/div>\n\n      <h2>Жидкости<\/h2>\n      <p class=\"msg\" style=\"margin:0 0 8px\">Слои заданы сверху вниз. Последний слой идёт до низа. Количество слоя — длиной по стволу (м MD) или объёмом (ббл, м³).<\/p>\n      <div class=\"fluid-head\">Затруб <span>(отсчёт от уровня жидкости)<\/span><\/div>\n      <table class=\"sec-table\"><thead><tr><th>ρ, ppg<\/th><th>Количество<\/th><th>Ед.<\/th><th><\/th><\/tr><\/thead><tbody id=\"annBody\"><\/tbody><\/table>\n      <button type=\"button\" class=\"btn small\" id=\"addAnn\">+ слой в затрубе<\/button>\n      <div class=\"fluid-head\" style=\"margin-top:14px\">НКТ <span>(отсчёт от устья)<\/span><\/div>\n      <table class=\"sec-table\"><thead><tr><th>ρ, ppg<\/th><th>Количество<\/th><th>Ед.<\/th><th><\/th><\/tr><\/thead><tbody id=\"tubBody\"><\/tbody><\/table>\n      <button type=\"button\" class=\"btn small\" id=\"addTub\">+ слой в НКТ<\/button>\n      <p class=\"msg\">Затруб тяжелее НКТ на ГЛМ — рассол потечёт в НКТ и без давления газа (клапан пропускает только в сторону НКТ). Это учитывается.<\/p>\n\n      <h2 style=\"margin-top:20px\">ГЛМ<\/h2>\n      <div class=\"field\">\n        <label for=\"L0\">Начальный уровень жидкости в затрубе (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"L0\" value=\"0\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">0 — затруб полностью заполнен жидкостью.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"glmMd\">Глубина ГЛМ по стволу (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"glmMd\" value=\"1400\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"glmTvd\">Глубина ГЛМ по вертикали (TVD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"glmTvd\" value=\"1200\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">Без инклинометрии ствол принимается прямым от устья до ГЛМ. С инклинометрией используется она, а это значение служит проверкой.<\/div>\n      <\/div>\n\n      <h2>Затрубное пространство<\/h2>\n      <table class=\"sec-table\">\n        <thead><tr><th>До MD, м<\/th><th>ID колонны, in<\/th><th>OD НКТ, in<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"secBody\"><\/tbody>\n      <\/table>\n      <button type=\"button\" class=\"btn small\" id=\"addSec\">+ секция<\/button>\n      <p class=\"msg\">Последняя секция действует до конца — «До MD» у неё можно не заполнять.<\/p>\n      <div class=\"field\" style=\"margin-top:10px\">\n        <label for=\"tubId\">Внутренний диаметр НКТ<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"tubId\" value=\"3.958\" step=\"0.001\"><span class=\"unit\">in<\/span><\/div>\n        <div class=\"hint\">НКТ 4,5\" 12,6# — ID 3,958\"; НКТ 5,5\" 23# (O-13ST) — ID 4,670\". Нужен для объёма жидкости в НКТ.<\/div>\n      <\/div>\n\n      <h2 style=\"margin-top:20px\">ГЛ клапан<\/h2>\n      <div class=\"field\">\n        <label for=\"vmode\">Характеристика клапана<\/label>\n        <div class=\"inp\"><select id=\"vmode\" style=\"width:100%\"><option value=\"port\">По диаметру порта<\/option><option value=\"dp\">По ΔP при макс. расходе<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"port\">\n        <label for=\"port\">Диаметр порта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"port\" value=\"0.375\" step=\"0.001\"><span class=\"unit\">in<\/span><\/div>\n        <div class=\"hint\">Временное значение — уточните по паспорту клапана.<\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"port\">\n        <label for=\"cd\">Коэффициент расхода Cd<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"cd\" value=\"0.80\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"dp\" hidden>\n        <label for=\"dpq\">ΔP на клапане при макс. расходе<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dpq\" class=\"has-unit\" value=\"170\" step=\"any\"><select data-pu=\"dpq\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"qMax\">Макс. расход через клапан<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"qMax\" value=\"1\" step=\"0.01\"><span class=\"unit\">ббл/мин<\/span><\/div>\n      <\/div>\n\n      <h2>Перфорация НКТ (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"perfOn\">Учитывать перфорацию<\/label>\n        <div class=\"inp\"><input type=\"checkbox\" id=\"perfOn\" style=\"width:auto\"><\/div>\n        <div class=\"hint\">Отверстия в НКТ (выше или ниже ГЛМ) работают параллельно клапану: рассол уходит и через них. Ограничение расхода относится к клапану.<\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfMd\">Глубина перфорации (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfMd\" value=\"1000\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\" id=\"perfTvd\"><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfN\">Количество отверстий<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfN\" value=\"4\" step=\"1\" min=\"1\"><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfD\">Диаметр отверстия<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfD\" value=\"1.0\" step=\"0.05\"><span class=\"unit\">см<\/span><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"rhoTub\">Жидкость в НКТ после входа газа <span data-adv hidden>(в сложном режиме считается)<\/span><\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"rhoTub\" step=\"0.01\" placeholder=\"как рассол\"><span class=\"unit\">ppg<\/span><\/div>\n        <div class=\"hint\">Нужна для перфорации ниже ГЛМ: когда газ уходит через клапан, НКТ выше ГЛМ облегчается (смесь). Пусто — НКТ остаётся в рассоле (максимальное требуемое давление).<\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfCd\">Коэффициент расхода Cd отверстий<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfCd\" value=\"0.80\" step=\"0.01\"><\/div>\n      <\/div>\n\n      <h2>График подачи<\/h2>\n      <div class=\"field\">\n        <label for=\"stepMin\">Длительность ступени<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"stepMin\" value=\"5\" step=\"any\"><span class=\"unit\">мин<\/span><\/div>\n        <div class=\"hint\">Меньше шаг — выше средний расход и быстрее замещение, но чаще переключения.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"round\">Шаг уставки давления<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"round\" class=\"has-unit\" value=\"10\" step=\"any\"><select data-pu=\"round\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Округляется вниз, чтобы не превысить расход.<\/div>\n      <\/div>\n\n      <div data-adv hidden>\n        <h2>Параметры сложной физики<\/h2>\n        <div class=\"field\">\n          <label for=\"muB\">Вязкость рассола<\/label>\n          <div class=\"inp\"><input type=\"number\" id=\"muB\" value=\"1.3\" step=\"0.05\"><span class=\"unit\">сП<\/span><\/div>\n          <div class=\"hint\">При температуре на устье. С глубиной падает.<\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"rough\">Шероховатость труб<\/label>\n          <div class=\"inp\"><input type=\"number\" id=\"rough\" value=\"0.046\" step=\"0.001\"><span class=\"unit\">мм<\/span><\/div>\n        <\/div>\n      <\/div>\n\n      <h2>Газ и температура<\/h2>\n      <div class=\"field\">\n        <label for=\"gg\">Отн. плотность газа (воздух = 1)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"gg\" value=\"0.70\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"z\">Коэффициент сверхсжимаемости Z <span data-adv hidden>(в сложном режиме считается по давлению)<\/span><\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"z\" value=\"0.90\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"qg\">Расход закачки газа<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"qg\" class=\"has-unit\" step=\"any\" placeholder=\"не ограничен\"><select id=\"qgUnit\"><option value=\"kscm\">тыс.м³/сут<\/option><option value=\"mmscf\">MMscf/д<\/option><\/select><\/div>\n        <div class=\"hint\">Необязательно. Ограничивает скорость роста давления в затрубе и показывает, хватит ли газа, чтобы пройти ниже ГЛМ. Пусто — подача не ограничена.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"ts\">Температура на устье<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"ts\" value=\"20\" step=\"any\"><span class=\"unit\">°C<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"tg\">Геотермический градиент<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"tg\" value=\"3\" step=\"0.1\"><span class=\"unit\">°C/100 м<\/span><\/div>\n      <\/div>\n\n      <h2>Инклинометрия (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"sfmt\">Формат данных<\/label>\n        <div class=\"inp\"><select id=\"sfmt\" style=\"width:100%\"><option value=\"incaz\">MD, угол, азимут<\/option><option value=\"mdtvd\">MD, TVD<\/option><\/select><\/div>\n      <\/div>\n      <textarea id=\"survey\" placeholder=\"Вставьте таблицу из Excel: по строке на точку, разделитель — пробел, Tab или ;\"><\/textarea>\n      <p class=\"msg\" id=\"surveyMsg\"><\/p>\n      <button type=\"button\" class=\"btn small\" id=\"demo\">Вставить пример<\/button>\n    <\/form>\n\n    <div class=\"stack\">\n      <section class=\"panel sec-res\" aria-live=\"polite\">\n        <h2>Результат<\/h2>\n        <div class=\"rescols\">\n          <div>\n            <div class=\"hero\">\n              <div class=\"big\" id=\"time\">—<\/div>\n              <span class=\"badge\" id=\"badge\"><\/span>\n            <\/div>\n            <p class=\"note\" id=\"note\"><\/p>\n          <\/div>\n          <table class=\"res\" id=\"table\"><\/table>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel sec-hyd\">\n        <h2>Гидростатика и давления по глубине<\/h2>\n        <div class=\"viz\">\n          <canvas id=\"chartH\" class=\"tall\" style=\"height:420px\"><\/canvas>\n          <div>\n            <div class=\"readout\" id=\"hydroTable\"><\/div>\n            <p class=\"msg\" id=\"hydroVerdict\"><\/p>\n          <\/div>\n        <\/div>\n        <p class=\"msg\">Статика на выбранный момент (ползунок на схеме): газ, столбы жидкостей по слоям, давление системы. Трение и многофазные эффекты здесь не показаны.<\/p>\n      <\/section>\n\n      <section class=\"panel sec-chart\">\n        <h2>График подачи давления<\/h2>\n        <canvas id=\"chartP\" class=\"mid\"><\/canvas>\n        <div class=\"legend\">\n          <span><i style=\"border-color:var(--c-casing)\"><\/i>Уставка давления<\/span>\n          <span id=\"legActual\" hidden><i class=\"dash\" style=\"border-color:var(--c-gas)\"><\/i>Фактическое давление при заданном расходе газа<\/span>\n        <\/div>\n        <div class=\"chart-head\" style=\"margin-top:12px\">\n          <h2 style=\"margin:0\">Расход через клапан<\/h2>\n          <div class=\"seg\" id=\"chartUnit\"><button data-u=\"psi\" class=\"on\">psi<\/button><button data-u=\"кПа\">кПа<\/button><\/div>\n        <\/div>\n        <canvas id=\"chartQ\" class=\"mid\"><\/canvas>\n        <div class=\"legend\">\n          <span><i style=\"border-color:var(--c-tubing)\"><\/i>Через клапан<\/span>\n          <span id=\"legPerf\" hidden><i style=\"border-color:var(--c-casing)\"><\/i>Через перфорацию НКТ<\/span>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel sec-viz\">\n        <div class=\"chart-head\">\n          <h2>Путь газа и жидкостей<\/h2>\n          <div class=\"controls inline\">\n            <button type=\"button\" class=\"btn primary\" id=\"play\">▶ Пуск<\/button>\n            <label style=\"font-size:13px;color:var(--muted)\"><input type=\"checkbox\" id=\"anim\" checked> анимация потоков<\/label>\n            <select id=\"speed\" aria-label=\"Скорость\"><option value=\"30\">30 с<\/option><option value=\"15\">15 с<\/option><option value=\"60\">60 с<\/option><\/select>\n          <\/div>\n        <\/div>\n        <div class=\"viz big\">\n          <canvas id=\"viz\" class=\"tall\"><\/canvas>\n          <div class=\"side\">\n            <div class=\"readout\" id=\"readout\"><\/div>\n            <div class=\"legend vleg\" id=\"fluidLegend\"><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"controls\"><input type=\"range\" id=\"scrub\" min=\"0\" max=\"100\" step=\"0.1\" value=\"0\" aria-label=\"Время\"><\/div>\n      <\/section>\n\n      <section class=\"panel sec-sched\">\n        <div class=\"chart-head\">\n          <h2>Таблица ступеней<\/h2>\n          <div><button type=\"button\" class=\"btn small\" id=\"csv\">Скачать CSV<\/button><\/div>\n        <\/div>\n        <div class=\"sched-wrap\"><table class=\"sched\" id=\"sched\"><\/table><\/div>\n        <details class=\"method\">\n          <summary>Как считается<\/summary>\n          <p>Рассол из затруба уходит через клапан в НКТ, а НКТ открыта на выкидную линию. Перепад на клапане: <code>ΔP = Pг(Dур) − Pсист − Gб·Dур<\/code>, где Pг — давление газа на уровне рассола (по TVD уровня, с учётом сжимаемости), Gб·Dур — гидростатика рассола.<\/p>\n          <p>Расход: <code>q = k·√ΔP<\/code>, <code>k = Cd·A·√(2/ρ)<\/code>. Начало каждой ступени: давление подбирается так, чтобы q = qmax, и округляется вниз. Пока ступень идёт, уровень опускается, ΔP и расход падают; затем давление поднимается. Расход не превышает qmax ни в какой момент.<\/p>\n          <p>Перфорация НКТ: расход через отверстия <code>qп = Cd·N·Aотв·√(2ΔP/ρ)<\/code>. Пока затруб и НКТ заполнены рассолом, перепад на перфорации равен перепаду на клапане (на любой глубине), поэтому график давления остаётся прежним, а уровень опускается быстрее (по сумме расходов). Перфорация ниже ГЛМ работает весь путь до ГЛМ (этап 1). Затем начинается этап 2: газ у клапана уходит в НКТ, и чтобы он пошёл вниз к перфорации, давление на ГЛМ должно превышать давление НКТ на гидростатику рассола между ГЛМ и уровнем минус вес газа (<code>ΔP = Pг(Dур) − Pсист − Gтр·Dглм − Gб·(Dур − Dглм)<\/code>). Расчёт идёт до выхода газа на перфорацию либо до остановки уровня: по давлению (упёрлись в максимум) или по расходу газа (газ уходит через клапан в НКТ быстрее, чем подаётся). Перфорация выше ГЛМ: когда уровень дошёл до неё, газ выходит в НКТ и расчёт заканчивается; рассол ниже в расчёте не вытесняется, его объём показан в результате.<\/p>\n          <p>Расход газа: запас газа в затрубе <code>M = Pабс·G(L)<\/code> (станд. м³, с учётом Z и температуры), подача ограничена введённым расходом; утечка через клапан в НКТ считается по формуле истечения газа через отверстие (порт клапана, Cd, k = 1,3).<\/p>\n          <p>Скорость опускания уровня: <code>q / ёмкость затруба<\/code> (ёмкость по MD из диаметров колонны и НКТ). Замещение закончено, когда уровень дошёл до ГЛМ по MD, дальше ограничение на газ не действует.<\/p>\n        <\/details>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\n/* Объекты: максимальное давление газлифта и давление системы (выкидная линия / сепаратор), psi.\n * ВАЖНО: pSystemPsi — временные значения (1000 psi), ждут уточнения от инженера. */\nwindow.GL_OBJECTS = [\n  { id: 'berkut', name: 'МСП Беркут',  pGasMaxPsi: 3000, pSystemPsi: 1000 },\n  { id: 'odoptu', name: 'БКП Одопту',  pGasMaxPsi: 2500, pSystemPsi: 1000 },\n  { id: 'orlan',  name: 'МСП Орлан',   pGasMaxPsi: 2900, pSystemPsi: 1000 }\n];\n\n<\/script>\n<script>\n/* Расчётное ядро: замещение рассола в затрубе газом через ГЛ клапан (ГЛМ) с ограничением расхода.\n *\n * Модель (квазистатическая, давления избыточные, внутри — кПа):\n *   - НКТ заполнена рассолом и открыта на выкидную линию (давление системы Pсист).\n *   - Газ закачивается в затруб с устья; уровень рассола в затрубе опускается, рассол уходит через клапан в НКТ.\n *   - Перепад на клапане:  ΔPкл = Pг(Dур) − Pсист − Gб·Dур,\n *       Pг(Dур) — давление газа на уровне рассола (по TVD уровня), Gб·Dур — гидростатика рассола.\n *     (столб рассола между уровнем и ГЛМ в затрубе и в НКТ взаимно уравновешивается)\n *   - Расход через клапан  q = k·√ΔPкл  (форма «отверстие»):\n *       k = Cd·A·√(2/ρ)  по диаметру порта, либо из известного ΔP при максимальном расходе.\n *   - Уставки давления подаются ступенями: в начале ступени давление такое, что q = qmax (округляется вниз),\n *     в течение ступени уровень опускается, ΔPкл и расход падают, затем давление поднимается на следующую ступень.\n *     Расход никогда не превышает qmax.\n *   - Рассол вытеснен, когда уровень дошёл до ГЛМ (по MD) — дальше ограничение на газ не распространяется.\n *   - Перфорация НКТ (необязательно) — параллельный путь рассола, k = Cd·N·A·√(2/ρ). Пока затруб и НКТ заполнены рассолом,\n *     перепад на ней равен перепаду на клапане. Если она выше ГЛМ, расчёт заканчивается выходом газа в НКТ на ней.\n */\n(function (root) {\n  'use strict';\n\n  var PSI = 6.894757, ATM = 101.325;\n  var BBL_M3 = 0.158987294928;\n  var PPG = 1.17512;        // 1 ppg → кПа/м\n  var PPG_KGM3 = 119.8264;  // 1 ppg → кг/м³\n  var IN = 0.0254;\n\n  /* ---------- инклинометрия ---------- */\n\n  function parseNumbers(text) {\n    var rows = [];\n    text.split(/\\r?\\n/).forEach(function (line) {\n      var t = line.trim();\n      if (!t) return;\n      var cells = t.split(/[;\\t ]+/).map(function (s) { return parseFloat(s.replace(',', '.')); });\n      if (!isFinite(cells[0])) return;           // заголовок или мусор\n      rows.push(cells);\n    });\n    return rows;\n  }\n\n  /* fmt: 'incaz' — MD, зенитный угол (°), азимут (°);  'mdtvd' — MD, TVD */\n  function parseSurvey(text, fmt) {\n    var rows = parseNumbers(text);\n    if (!rows.length) return { pts: null };\n    var need = fmt === 'mdtvd' ? 2 : 3;\n    for (var i = 0; i < rows.length; i++) {\n      for (var j = 0; j < need; j++) {\n        if (!isFinite(rows[i][j])) return { error: 'Строка ' + (i + 1) + ': нужно ' + need + ' числа (' + (fmt === 'mdtvd' ? 'MD, TVD' : 'MD, угол, азимут') + ').' };\n      }\n      if (i > 0 && rows[i][0] <= rows[i - 1][0]) return { error: 'MD должен строго возрастать (строка ' + (i + 1) + ').' };\n    }\n    var pts = [];\n    if (fmt === 'mdtvd') {\n      if (rows[0][0] > 0) rows.unshift([0, 0]);\n      var dep = 0;\n      rows.forEach(function (r, i) {\n        if (i > 0) {\n          var dm = r[0] - rows[i - 1][0], dt = r[1] - rows[i - 1][1];\n          if (dt > dm + 1e-6) throw new Error('TVD растёт быстрее MD (строка ' + (i + 1) + ').');\n          dep += Math.sqrt(Math.max(dm * dm - dt * dt, 0));\n        }\n        pts.push({ md: r[0], tvd: r[1], dep: dep });\n      });\n    } else {\n      if (rows[0][0] > 0) rows.unshift([0, rows[0][1], rows[0][2]]);\n      var tvd = 0, N = 0, Ee = 0, R = Math.PI / 180;\n      rows.forEach(function (r, i) {\n        if (i > 0) {\n          var p = rows[i - 1], dm = r[0] - p[0];\n          var I1 = p[1] * R, I2 = r[1] * R, A1 = p[2] * R, A2 = r[2] * R;\n          var c = Math.cos(I2 - I1) - Math.sin(I1) * Math.sin(I2) * (1 - Math.cos(A2 - A1));\n          var DL = Math.acos(Math.max(-1, Math.min(1, c)));\n          var RF = DL < 1e-6 ? 1 : 2 / DL * Math.tan(DL / 2);\n          tvd += dm / 2 * (Math.cos(I1) + Math.cos(I2)) * RF;\n          N += dm / 2 * (Math.sin(I1) * Math.cos(A1) + Math.sin(I2) * Math.cos(A2)) * RF;\n          Ee += dm / 2 * (Math.sin(I1) * Math.sin(A1) + Math.sin(I2) * Math.sin(A2)) * RF;\n        }\n        pts.push({ md: r[0], tvd: tvd, dep: Math.sqrt(N * N + Ee * Ee) });\n      });\n    }\n    return { pts: pts };\n  }\n\n  /* профиль ствола: интерполяция MD → TVD / отход; за последней точкой — продолжение по последнему интервалу */\n  function makeProfile(survey, glmMd, glmTvd) {\n    var pts = survey && survey.length >= 2 ? survey :\n      [{ md: 0, tvd: 0, dep: 0 }, { md: glmMd, tvd: Math.min(glmTvd, glmMd), dep: Math.sqrt(Math.max(glmMd * glmMd - glmTvd * glmTvd, 0)) }];\n    function seg(md) {\n      var n = pts.length;\n      if (md <= pts[0].md) return 1;\n      if (md >= pts[n - 1].md) return n - 1;\n      var lo = 1, hi = n - 1;\n      while (lo < hi) { var m = (lo + hi) >> 1; if (pts[m].md >= md) hi = m; else lo = m + 1; }\n      return lo;\n    }\n    function at(md, key) {\n      var i = seg(md), a = pts[i - 1], b = pts[i];\n      return a[key] + (b[key] - a[key]) * (md - a.md) / (b.md - a.md);\n    }\n    return {\n      pts: pts,\n      tvdAt: function (md) { return md <= 0 ? 0 : at(md, 'tvd'); },\n      depAt: function (md) { return md <= 0 ? 0 : at(md, 'dep'); }\n    };\n  }\n\n  /* ---------- геометрия затрубья ---------- */\n  /* sections: [{ toMd, dc, dt }] — дюймы; последняя секция действует до конца */\n  function makeCapacity(sections) {\n    var s = sections.slice().sort(function (a, b) { return (a.toMd === null ? 1e12 : a.toMd) - (b.toMd === null ? 1e12 : b.toMd); });\n    return function (md) {    // bbl/м\n      var k = s[s.length - 1];\n      for (var i = 0; i < s.length; i++) { if (s[i].toMd !== null && md < s[i].toMd) { k = s[i]; break; } }\n      var A = Math.PI / 4 * (Math.pow(k.dc * IN, 2) - Math.pow(k.dt * IN, 2));\n      return A / BBL_M3;\n    };\n  }\n\n  /* ---------- расчёт ---------- */\n  var K_GAS = 1.3;            // показатель адиабаты газа\n  var R_GAS = 8.314, T_SC = 288.7, RHO_STD_AIR = 1.2229;   // стандартные условия 60 °F / 1 атм\n\n  function calc(p) {\n    var Gb = PPG * p.rho;                                   // градиент рассола, кПа/м\n    var Gt = PPG * (p.rhoTub > 0 ? p.rhoTub : p.rho);       // градиент жидкости в НКТ после входа газа\n    var cap = makeCapacity(p.sections);\n    var prof = p.profile;\n    var glmTvd = prof.tvdAt(p.glmMd);\n\n    // клапан: q [bbl/min] = k·√ΔP[кПа]\n    var kv, portArea = null;\n    if (p.valve.mode === 'port') {\n      portArea = Math.PI / 4 * Math.pow(p.valve.portIn * IN, 2);\n      kv = p.valve.cd * portArea * Math.sqrt(2000 / (p.rho * PPG_KGM3)) * 60 / BBL_M3;\n    } else {\n      kv = p.qMax / Math.sqrt(p.valve.dpAtQmax);\n    }\n    var dpStar1 = Math.pow(p.qMax / kv, 2);                 // ΔP на клапане при qmax, кПа\n\n    // перфорация НКТ: параллельный путь для рассола\n    var perf = p.perf || null, kp = 0;\n    var perfAbove = !!perf && perf.md < p.glmMd, perfBelow = !!perf && perf.md > p.glmMd;\n    var Lend = perf ? perf.md : p.glmMd;\n    if (perf) kp = perf.cd * perf.n * Math.PI / 4 * Math.pow(perf.dCm / 100, 2) * Math.sqrt(2000 / (p.rho * PPG_KGM3)) * 60 / BBL_M3;\n    var round = p.roundKpa > 0 ? p.roundKpa : 1;\n    // на этапе ниже ГЛМ расход через перфорацию не ограничен: уставка выше равновесной на один шаг давления\n    var dpStar2 = perfBelow ? round : 0;\n\n    // F(D) = P(D)/P(0) для газа в затрубе (кэш по глубине)\n    var fCache = {};\n    function gasF(D) {\n      if (D <= 0) return 1;\n      var key = Math.round(D * 4);\n      if (fCache[key] !== undefined) return fCache[key];\n      var n = Math.max(1, Math.ceil(D / 5)), dz = D / n, f = 1;\n      for (var i = 0; i < n; i++) {\n        var T = 273.15 + p.ts + p.tg * ((i + 0.5) * dz) / 100;\n        f *= Math.exp(0.03415 * p.gg * dz / (p.z * T));\n      }\n      return (fCache[key] = f);\n    }\n\n    // этап 1: уровень выше ГЛМ (НКТ и затруб в рассоле); этап 2: уровень ниже ГЛМ (газ уже у клапана)\n    function stageOf(L) { return perfBelow && L >= p.glmMd ? 2 : 1; }\n    function H(D, st) { return st === 1 ? Gb * D : Gt * glmTvd + Gb * (D - glmTvd); }\n    function dpEff(ps, D, F, st) { return (ps + ATM) * F - ATM - p.pSys - H(D, st); }\n    function psNeeded(D, F, st) { return (p.pSys + H(D, st) + (st === 1 ? dpStar1 : dpStar2) + ATM) / F - ATM; }\n\n    // газ в затрубе: запас в станд. м³ = (Pабс устья) · G(L)\n    var finite = isFinite(p.qgStd) && p.qgStd > 0;\n    var Gcum = [0], nG = Math.ceil(Lend) + 3;\n    for (var g = 0; g < nG; g++) {\n      var mdm = g + 0.5, Dg = prof.tvdAt(mdm);\n      var area = cap(mdm) * BBL_M3;                          // м² затруба\n      var Tg = 273.15 + p.ts + p.tg * Dg / 100;\n      Gcum.push(Gcum[g] + area * gasF(Dg) * (T_SC / Tg) / (p.z * ATM));\n    }\n    function Gof(L) {\n      var x = Math.max(L, 5), i = Math.min(Math.floor(x), Gcum.length - 2);\n      return Gcum[i] + (Gcum[i + 1] - Gcum[i]) * (x - i);\n    }\n\n    // утечка газа через клапан в НКТ на этапе 2 (станд. м³/мин); нужен диаметр порта\n    var leakKnown = portArea !== null;\n    var T1 = 273.15 + p.ts + p.tg * glmTvd / 100, Mw = 0.02897 * p.gg, rhoStd = RHO_STD_AIR * p.gg;\n    var rc = Math.pow(2 / (K_GAS + 1), K_GAS / (K_GAS - 1));\n    function gasLeak(pa) {\n      if (!leakKnown) return 0;\n      var P1 = ((pa + ATM) * gasF(glmTvd)) * 1000;          // Па абс. в затрубе у ГЛМ\n      var P2 = (p.pSys + Gt * glmTvd + ATM) * 1000;         // Па абс. в НКТ у ГЛМ\n      if (P1 <= P2) return 0;\n      var r = Math.max(P2 / P1, rc);\n      var mdot = p.valve.cd * portArea * P1 * Math.sqrt(Mw / (p.z * R_GAS * T1) * (2 * K_GAS / (K_GAS - 1)) * (Math.pow(r, 2 / K_GAS) - Math.pow(r, (K_GAS + 1) / K_GAS)));\n      return mdot * 60 / rhoStd;\n    }\n\n    var L = p.L0, t = 0, vol = 0, gasIn = 0, tGlm = null, dtSub = 0.05;\n    var pa = finite ? 0 : null, M = finite ? ATM * Gof(L) : 0;\n    var trace = [{ t: 0, L: L, ps: 0, pa: 0, q: 0, qp: 0, qg: 0, vol: 0 }], steps = [];\n    var status = null, reason = null, capped = false, firstNeeded = null;\n\n    var totalVol = 0, volBelow = 0, m;\n    for (m = p.L0; m < Lend; m += 1) totalVol += cap(m + 0.5) * Math.min(1, Lend - m);\n    if (perf) {\n      var a = Math.min(perf.md, p.glmMd), b = Math.max(perf.md, p.glmMd);\n      for (m = a; m < b; m += 1) volBelow += cap(m + 0.5) * Math.min(1, b - m);\n    }\n\n    for (var si = 0; si < 2 + ' м³<\/span>'; }\n\n  /* ---------- расчёт и вывод ---------- */\n  function run() {\n    var r = readParams();\n    var badge = $('badge'), time = $('time'), note = $('note'), table = $('table');\n    if (r.errs.length) {\n      time.innerHTML = '—';\n      badge.className = 'badge bad'; badge.textContent = 'Проверьте ввод';\n      note.textContent = 'Некорректные поля: ' + r.errs.join('; ') + '.';\n      table.innerHTML = ''; $('sched').innerHTML = ''; $('readout').innerHTML = '';\n      last = null; stopPlay(); drawAll();\n      return;\n    }\n    var p = r.p, res = DispCore.calc(p);\n    setFluidPalette(res);\n    last = { p: p, res: res };\n    $('scrub').max = res.totalTime;\n    if (tcur > res.totalTime) tcur = res.totalTime;\n    $('scrub').value = tcur;\n\n    time.innerHTML = nf0.format(res.totalTime) + ' <small>мин<\/small>' +\n      (res.totalTime >= 60 ? ' <small>(' + nf1.format(res.totalTime / 60) + ' ч)<\/small>' : '');\n    var belowGlm = res.perfBelow && res.level >= p.glmMd - 0.5;\n    if (res.status === 'reached' && !res.capped) {\n      badge.className = 'badge ok'; badge.textContent = 'Газ достигает ГЛМ';\n      note.textContent = 'После этого ограничение по расходу не действует, можно выводить газлифт на полный режим.';\n    } else if (res.status === 'reached') {\n      badge.className = 'badge warn'; badge.textContent = 'Часть графика на максимуме давления';\n      note.textContent = 'На части ступеней давление ограничено максимумом газлифта, расход там ниже предела, но газ ГЛМ достигает.';\n    } else if (res.status === 'perf') {\n      badge.className = res.capped ? 'badge warn' : 'badge ok';\n      badge.textContent = res.capped ? 'Газ выходит в НКТ (давление на максимуме)' : 'Газ выходит в НКТ через перфорацию';\n      note.textContent = 'Газ дошёл до перфорации на ' + nf0.format(res.level) + ' м MD (' + nf0.format(res.levelTvd) + ' м TVD). Ниже в затрубе остаётся ' +\n        nf1.format(res.volBelow) + ' ббл рассола до ГЛМ: он в этом р / 2); c.textAlign = 'center'; c.textBaseline = 'top';\n    c.fillStyle = css('--muted'); c.fillText('TVD, м', 0, 0); c.restore();\n\n    function path(md0, md1, width, color, cap, dash, off) {\n      if (md1 <= md0) return;\n      c.beginPath();\n      var n = Math.max(2, Math.ceil((md1 - md0) / 4));\n      for (var i = 0; i <= n; i++) { var md = md0 + (md1 - md0) * i / n; i ? c.lineTo(PX(md), PY(md)) : c.moveTo(PX(md), PY(md)); }\n      c.lineWidth = width; c.strokeStyle = color; c.lineCap = cap || 'butt'; c.lineJoin = 'round';\n      c.setLineDash(dash || []); c.lineDashOffset = off || 0; c.stroke(); c.setLineDash([]); c.lineDashOffset = 0;\n    }\n\n    // --- состояние содержимого ---\n    var sn = snapAt(tcur), lay = res.layout(sn), Lv = sn.L;\n    var tubEntry = perfAbove ? perf.md : p.glmMd;                 // где газ входит в НКТ\n    var tubEnd = perfBelow ? perf.md : p.glmMd;                   // низ НКТ в схеме\n    var gasInTub = (res.perfBelow && Lv >= p.glmMd - 0.5) || (!res.perfBelow && Lv >= res.Lend - 0.5 && res.status !== 'stalled');\n    var aB = 0, aT = 0;\n    if (gasInTub) {\n      if (res.mode === 'advanced') { aB = st.aB || 0; aT = st.aT || 0; if (aB === 0 && aT === 0) { aB = 0.3; aT = 0.5; } }\n      else if (p.rhoTub > 0 && p.rhoTub < p.rho) { aB = aT = 1 - p.rhoTub / p.rho; }\n      else { aB = 0.25; aT = 0.4; }                                // ориентировочно (в упрощённом режиме доля газа не считается)\n    }\n    var q = st.q || 0, qp = st.qp || 0, qt = q + qp, qg = st.qg || 0;\n\n    // --- слои жидкостей из снимка состояния ---\n    function liquidColor(rho) { return fluidColor(rho); }\n    // --- затруб (внешняя полоса) и колонна ---\n    path(0, mdEnd, 34, css('--muted'), 'round'); c.globalAlpha = 1;\n    path(0, mdEnd, 30, cSurf, 'round');\n    lay.ann.forEach(function (sg) { path(sg.md0, Math.min(sg.md1, mdEnd), 26, liquidColor(sg.rho)); });\n    path(exitMd, mdEnd, 26, 'rgba(255,255,255,0.55)');                                //  gy + 8, gx - 11, gy + 8, cGas); arrow(c, gx + 30, gy + 8, gx + 11, gy + 8, cGas); }\n    tag('ГЛМ ' + nf0.format(p.glmMd) + ' м MD · ' + nf0.format(prof.tvdAt(p.glmMd)) + ' м TVD', gx, gy - 26, cInk, true);\n\n    // --- перфорация НКТ ---\n    if (perf) {\n      var qx = PX(perf.md), qy = PY(perf.md);\n      for (var hI = -1; hI <= 1; hI += 2) {\n        c.strokeStyle = cInk; c.lineWidth = 2; c.beginPath(); c.moveTo(qx + hI * 6, qy - 5); c.lineTo(qx + hI * 6, qy + 5); c.stroke();\n        if (qp > 0.02) arrow(c, qx + hI * 26, qy, qx + hI * 9, qy, cBrine);\n      }\n      tag('перфорация ' + nf0.format(perf.md) + ' м MD · ' + perf.n + ' × ⌀' + nf1.format(perf.dCm) + ' см', qx, qy + 24, cInk, true);\n    }\n\n    // --- уровень рассола в затрубе ---\n    if (Lv < res.Lend - 0.5 || res.status === 'stalled') {\n      var lx_ = PX(Lv), ly_ = PY(Lv);\n      c.beginPath(); c.arc(lx_, ly_, 7, 0, 7); c.fillStyle = cSurf; c.fill(); c.lineWidth = 3; c.strokeStyle = cGas; c.stroke();\n      tag('уровень рассола ' + nf0.format(Lv) + ' м MD', lx_, ly_ + (perf && Math.abs(Lv - perf.md) < 80 ? -18 : 0), cInk, false);\n    } else {\n      var ex = PX(res.Lend), ey = PY(res.Lend);\n      tag(res.status === 'perf' ? 'газ в НКТ' : res.status === 'perfBelow' ? 'газ у перфорации' : 'газ у ГЛМ', ex, ey + 40, cGas, false);\n    }\n    // подписи затруба и НКТ\n    c.font = '600 11px -apple-system, \"Segoe UI\", sans-serif'; c.fillStyle = css('--muted'); c.textAlign = 'left'; c.textBaseline = 'middle';\n    var lby = PY(Math.min(120, p.glmMd * 0.12));\n    c.fillText('затруб', PX(Math.min(120, p.glmMd * 0.12)) + 22, lby - 6);\n    c.fillText('НКТ', PX(Math.min(120, p.glmMd * 0.12)) + 22, lby + 8);\n    // --- подписи слоёв: плотности прямо на схеме ---\n    var labels = [], present = {};\n    function addLabel(md, text, color, key) { labels.push({ md: md, x: PX(md), y: PY(md), text: text, color: color, key: key }); }\n    lay.ann.forEach(function (sg) {\n      var a = sg.md0, b = Math.min + ')<\/span>' });\n    });\n    if (gasInTub) items.push({ col: 'linear-gradient(90deg,' + cBrine + ',' + cGas + ')', text: 'Смесь газ + жидкость в НКТ' });\n    var lhtml = items.map(function (it) { return '<span><i class=\"sq\" style=\"background:' + it.col + '\"><\/i>' + it.text + '<\/span>'; }).join('') +\n      '<span style=\"color:var(--muted);display:block\">Бледная жидкость ниже выходов не вытесняется. Белые точки — движение потоков. Затруб — внешняя полоса, НКТ — внутренняя.<\/span>';\n    var lg = $('fluidLegend'); if (lg && lg.dataset.h !== lhtml) { lg.innerHTML = lhtml; lg.dataset.h = lhtml; }\n    $('readout').innerHTML = readoutHtml(st);\n  }\n\n  function readoutHtml(st) {\n    var res = last.res, prof = last.p.profile;\n    function r(k, v) { return '<div><span>' + k + '<\/span><b>' + v + '<\/b><\/div>'; }\n    var done = st.L >= res.Lend - 0.5;\n    return r('Время', nf1.format(st.t) + ' мин') +\n      r('Давление на устье', nf0.format((res.finite ? st.pa : (st.ps || res.steps[0].ps)) / PSI) + ' psi<br>' + nf0.format(res.finite ? st.pa : (st.ps || res.steps[0].ps)) + ' кПа') +\n      r('Уровень рассола', nf0.format(st.L) + ' м MD<br>' + nf0.format(prof.tvdAt(st.L)) + ' м TVD') +\n      r('Расход через клапан', nf2.format(st.q) + ' ббл/мин') +\n      (res.perf ? r('Расход через перфорацию', nf2.format(st.qp) + ' ббл/мин') : '') +\n      (res.perfBelow && res.leakKnown ? r('Газ в НКТ через клапан', nf1.format(st.qg * 1440 / 1000) + ' тыс. м³/сут') : '') +\n      (res.mode === 'advanced' && st.aT > 0 ? r('Доля газа в НКТ', nf0.format(st.aB * 100) + ' % у ГЛМ<br>' + nf0.format(st.aT * 100) + ' % у устья') : '') +\n      r('Вытеснено', nf1.format(st.vol) + ' ббл<br>' + nf1.format(st.vol * BBL) + ' м³') +\n      r('Состояние', done ? (res.status === 'reached' ? 'газ у ГЛМ' : res.status === 'perf' ? 'газ в НКТ' : res.status === 'perfBelow' ? 'газ у перфорации' : 'остановка') : 'вытеснение');\n  }\n\n  function drawAll() { drawCharts(); drawViz(); renderHyd <script>
(function () {
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var frame = document.getElementById('app');
  function current() { var h = location.hash.slice(1); return pages[h] ? h : 'index'; }
  function show() {
    var name = current();
    if (frame.dataset.page === name) return;
    frame.dataset.page = name;
    frame.srcdoc = pages[name];
  }
  frame.addEventListener('load', function () {
    var d = frame.contentDocument;
    if (!d) return;
    document.title = d.title || 'WellTools';
    d.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var name = a.getAttribute('href').slice(1);
      if (pages[name]) location.hash = name;
    });
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
