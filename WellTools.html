дрели<\/h1>\n  <p class=\"lead\">Давление газлифта в затрубе на глубине ГЛМ должно быть больше гидростатики жидкости заканчивания плюс давления в выкидной линии (давления системы). Все давления — избыточные.<\/p>\n\n  <div class=\"grid\">\n    <form class=\"panel\" id=\"form\" autocomplete=\"off\" onsubmit=\"return false\">\n      <h2>Объект<\/h2>\n      <div class=\"field\">\n        <label for=\"obj\">Платформа<\/label>\n        <div class=\"inp\"><select id=\"obj\" style=\"width:100%\"><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pGas\">Макс. давление газлифта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pGas\" class=\"has-unit\" data-p step=\"any\"><select data-pu=\"pGas\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Задаётся объектом, можно изменить вручную.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pSys\">Давление системы (выкидная линия)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pSys\" class=\"has-unit\" data-p step=\"any\"><select data-pu=\"pSys\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\" id=\"sysHint\">Временное значение, будет уточнено.<\/div>\n      <\/div>\n\n      <h2>Жидкость заканчивания<\/h2>\n      <div class=\"field\">\n        <label for=\"rho\">Плотность<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"rho\" value=\"8.6\" step=\"0.01\"><span class=\"unit\">ppg<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"dP\">Запас давления<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dP\" class=\"has-unit\" data-p value=\"0\" step=\"any\"><select data-pu=\"dP\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Необязательно. Сколько давления газа должно остаться сверх необходимого.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"dMax\">Макс. глубина ГЛМ (TVD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dMax\" step=\"any\" placeholder=\"без ограничения\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">Необязательно: пакер, перфорация и т.п.<\/div>\n      <\/div>\n\n      <h2>Газ и температура<\/h2>\n      <div class=\"field\">\n        <label for=\"gg\">Отн. плотность газа (воздух = 1)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"gg\" value=\"0.70\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"z\">Коэффициент сверхсжимаемости Z<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"z\" value=\"0.90\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"ts\">Температура на устье<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"ts\" value=\"20\" step=\"any\"><span class=\"unit\">°C<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"tg\">Геотермический градиент<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"tg\" value=\"3\" step=\"0.1\"><span class=\"unit\">°C/100 м<\/span><\/div>\n      <\/div>\n\n      <h2>Установленные мандрели (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"mand\">Глубины по TVD, м<\/label>\n        <div class=\"inp\"><input type=\"text\" id=\"mand\" placeholder=\"например 600, 1100, 1550\"><\/div>\n        <div class=\"hint\">Через запятую. Подберём ближайшую не глубже расчётной.<\/div>\n      <\/div>\n    <\/form>\n\n    <div>\n      <section class=\"panel\" aria-live=\"polite\">\n        <h2>Результат<\/h2>\n        <div class=\"hero\">\n          <div class=\"big\" id=\"depth\">—<\/div>\n          <span class=\"badge\" id=\"badge\"><\/span>\n        <\/div>\n        <p class=\"note\" id=\"note\"><\/p>\n        <table class=\"res\" id=\"table\"><\/table>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"chart-head\">\n          <h2>Давления по глубине<\/h2>\n          <div class=\"seg\" id=\"chartUnit\"><button data-u=\"psi\" class=\"on\">psi<\/button><button data-u=\"кПа\">кПа<\/button><\/div>\n        <\/div>\n        <canvas id=\"chart\"><\/canvas>\n        <div class=\"legend\">\n          <span><i style=\"border-color:var(--c-casing)\"><\/i>Давление газлифта в затрубе<\/span>\n          <span><i style=\"border-color:var(--c-tubing)\"><\/i>Гидростатика жидкости + давление системы<\/span>\n        <\/div>\n        <details class=\"method\">\n          <summary>Как считается<\/summary>\n          <p>Давление газа на глубине D: <code>Pг = Pгл · exp(0,03415·γг·D / (Z·T))<\/code>, интегрируется по участкам с ростом температуры (T в К, давление абсолютное).<\/p>\n          <p>Противодавление: <code>Pж = Pсист + Gж·D<\/code>, где Gж — гидростатический градиент жидкости заканчивания (0,052·ρ[ppg] psi/ft).<\/p>\n          <p>Глубина ГЛМ — наибольшая D, при которой <code>Pг(D) &gt; Pж(D) + запас<\/code>. Глубже газ уже не сможет вытеснить жидкость.<\/p>\n        <\/details>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\n/* Объекты: максимальное давление газлифта и давление системы (выкидная линия / сепаратор), psi.\n * ВАЖНО: pSystemPsi — временные значения (1000 psi), ждут уточнения от инженера. */\nwindow.GL_OBJECTS = [\n  { id: 'berkut', name: 'МСП Беркут',  pGasMaxPsi: 3000, pSystemPsi: 1000 },\n  { id: 'odoptu', name: 'БКП Одопту',  pGasMaxPsi: 2500, pSystemPsi: 1000 },\n  { id: 'orlan',  name: 'МСП Орлан',   pGasMaxPsi: 2900, pSystemPsi: 1000 }\n];\n\n<\/script>\n<script>\n/* Расчётное ядро: максимальная глубина посадки газлифтовой мандрели (ГЛМ).\n *\n * Условие: давление газлифта в затрубе на глубине ГЛМ должно быть больше\n *   гидростатики жидкости заканчивания + давления системы (выкидная линия / сепаратор):\n *     Pг(D) > Pсист + Gж·D (+ запас)\n *   Pг(D) = Pгл · exp(0,03415·γг·D / (Z·T))  — по участкам, T(z) линейна; давления избыточные, расчёт в кПа.\n * Результат — наибольшая D, при которой условие выполняется (не глубже dMax, если задан).\n */\n(function (root) {\n  'use strict';\n\n  var PSI = 6.894757;          // кПа в 1 psi\n  var ATM = 101.325;           // кПа\n  var PPG_TO_KPA_M = 1.17512;  // 1 ppg → кПа/м\n\n  function calc(p) {\n    var Gl = PPG_TO_KPA_M * p.rho;\n\n    function gasP(D) {\n      if (D <= 0) return p.pGas;\n      var n = Math.max(1, Math.ceil(D / 5)), dz = D / n, P = p.pGas + ATM;\n      for (var i = 0; i < n; i++) {\n        var T = 273.15 + p.ts + p.tg * ((i + 0.5) * dz) / 100;\n        P *= Math.exp(0.03415 * p.gg * dz / (p.z * T));\n      }\n      return P - ATM;\n    }\n    function liqP(D) { return p.pSys + Gl * D; }          // давление столба жидкости + система\n    function margin(D) { return gasP(D) - liqP(D) - p.dP; } // >0 — условие выполняется\n\n    var res = { Gl: Gl, gasP: gasP, liqP: liqP, margin: margin, limited: false };\n\n    if (margin(0) <= 0) { res.status = 'none'; res.depth = null; return res; }\n\n    var hi = (p.pGas - p.pSys) / (0.5 * Gl) + 10;   // заведомо глубже корня (газ втрое легче жидкости и более)\n    var limit = isFinite(p.dMax) && p.dMax > 0 ? p.dMax : null;\n    if (limit !== null && margin(limit) > 0) {\n      res.status = 'limited'; res.depth = limit; res.limited = true;\n    } else {\n      var lo = 0;\n      if (limit !== null) hi = Math.min(hi, limit);\n      for (var i = 0; i < 80; i++) {\n        var mid = (lo + hi) / 2;\n        if (margin(mid) > 0) lo = mid; else hi = mid;\n      }\n      res.status = 'ok'; res.depth = lo;\n    }\n\n    var D = res.depth;\n    res.pGasAt = gasP(D);\n    res.pHydro = Gl * D;\n    res.pLiqAt = liqP(D);\n    res.gasGrad = (gasP(D + 1) - gasP(Math.max(D - 1, 0))) / (D > 0 ? 2 : 1);\n\n    if (limit !== null) {   // какое давление ГЛ нужно, чтобы дойти до заданной глубины\n      var F = (gasP(limit) + ATM) / (p.pGas + ATM);\n      res.pGasRequired = (liqP(limit) + p.dP + ATM) / F - ATM;\n    }\n    return res;\n  }\n\n  /* из установленных мандрелей — глубочайшая, не глубже расчётной */\n  function pickMandrel(list, depth) {\n    var s = list.slice().sort(function (a, b) { return a - b; }), best = null, next = null;\n    for (var i = 0; i < s.length; i++) {\n      if (s[i] <= depth + 1e-9) best = s[i]; else { next = s[i]; break; }\n    }\n    return { best: best, next: next };\n  }\n\n  var api = { calc: calc, pickMandrel: pickMandrel, PSI: PSI, ATM: ATM };\n  if (typeof module !== 'undefined' && module.exports) module.exports = api;\n  else root.GLEngine = api;\n})(this);\n\n<\/script>\n<script>\n(function () {\n  'use strict';\n  var E = window.GLEngine, OBJ = window.GL_OBJECTS;\n  var PSI = E.PSI;\n  var $ = function (id) { return document.getElementById(id); };\n  var chartUnit = 'psi';\n  var last = null;\n\n  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });\n  var nf3 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 3 });\n\n  function unitOf(id) { var s = document.querySelector('select[data-pu=\"' + id + '\"]'); return s ? s.value : 'psi'; }\n  function toKPa(v, u) { return u === 'psi' ? v * PSI : v; }\n  function fromKPa(v, u) { return u === 'psi' ? v / PSI : v; }\n  function pBoth(kpa) { return nf0.format(kpa / PSI) + ' psi <span class=\"alt\">' + nf0.format(kpa) + ' кПа<\/span>'; }\n  function num(id) { return parseFloat($(id).value); }\n  function fmtIn(kpa, u) { var v = fromKPa(kpa, u); return u === 'psi' ? Math.round(v * 100) / 100 : Math.round(v); }\n\n  /* выбор объекта */\n  var objSel = $('obj');\n  OBJ.forEach(function (o) { var op = document.createElement('option'); op.value = o.id; op.textContent = o.name; objSel.appendChild(op); });\n\n  function applyObject() {\n    var o = OBJ.filter(function (x) { return x.id === objSel.value; })[0];\n    $('pGas').value = fmtIn(o.pGasMaxPsi * PSI, unitOf('pGas'));\n    $('pSys').value = fmtIn(o.pSystemPsi * PSI, unitOf('pSys'));\n  }\n  objSel.addEventListener('change', function () { applyObject(); run(); });\n\n  /* смена единицы: физическое значение остаётся тем же */\n  var prevUnit = {};\n  document.querySelectorAll('select[data-pu]').forEach(function (s) {\n    prevUnit[s.dataset.pu] = s.value;\n    s.addEventListener('change', function () {\n      var inp = $(s.dataset.pu), v = parseFloat(inp.value);\n      if (isFinite(v)) inp.value = fmtIn(toKPa(v, prevUnit[s.dataset.pu]), s.value);\n      prevUnit[s.dataset.pu] = s.value;\n      run();\n    });\n  });\n\n  function readParams() {\n    var errs = [];\n    function need(id, label, cond) {\n      var v = num(id);\n      if (!isFinite(v) || (cond && !cond(v))) errs.push(label);\n      return v;\n    }\n    var dMaxRaw = $('dMax').value.trim();\n    var p = {\n      pGas: toKPa(need('pGas', 'Давление газлифта', function (v) { return v > 0; }), unitOf('pGas')),\n      pSys: toKPa(need('pSys', 'Давление системы', function (v) { return v >= 0; }), unitOf('pSys')),\n      rho: need('rho', 'Плотность', function (v) { return v > 0; }),\n      dP: toKPa(need('dP', 'Запас давления', function (v) { return v >= 0; }), unitOf('dP')),\n      dMax: dMaxRaw === '' ? Infinity : need('dMax', 'Макс. глубина', function (v) { return v > 0; }),\n      gg: need('gg', 'Плотность газа', function (v) { return v > 0.2 && v < 2; }),\n      z: need('z', 'Z', function (v) { return v > 0.3 && v < 1.5; }),\n      ts: need('ts', 'Температура на устье'),\n      tg: need('tg', 'Геотермический градиент')\n    };\n    return { p: p, errs: errs };\n  }\n\n  function parseMandrels() {\n    return $('mand').value.split(/[;,\\s]+/).map(parseFloat).filter(function (v) { return isFinite(v) && v > 0; });\n  }\n  function row(k, v) { return '<tr><td>' + k + '<\/td><td>' + v + '<\/td><\/tr>'; }\n\n  function run() {\n    var r = readParams();\n    var badge = $('badge'), depth = $('depth'), note = $('note'), table = $('table');\n    if (r.errs.length) {\n      depth.innerHTML = '—';\n      badge.className = 'badge bad'; badge.textContent = 'Проверьте ввод';\n      note.textContent = 'Некорректные поля: ' + r.errs.join(', ') + '.';\n      table.innerHTML = ''; last = null; drawChart();\n      return;\n    }\n    var p = r.p, res = E.calc(p);\n    last = { p: p, res: res };\n\n    if (res.status === 'none') {\n      depth.innerHTML = '—';\n      badge.className = 'badge bad'; badge.textContent = 'Нет решения';\n      note.textContent = 'Давление газлифта не превышает давление системы даже у устья — газ не вытеснит жидкость на любой глубине.';\n      table.innerHTML = ''; drawChart();\n      return;\n    }\n\n    depth.innerHTML = nf0.format(res.depth) + ' <small>м TVD<\/small>';\n    if (res.status === 'ok') {\n      badge.className = 'badge ok'; badge.textContent = 'Определяется балансом давлений';\n      note.textContent = 'Глубже давление газа в затрубе становится меньше гидростатики жидкости и давления системы.';\n    } else {\n      badge.className = 'badge warn'; badge.textContent = 'Ограничено макс. глубиной';\n      note.textContent = 'Давления газлифта хватает и глубже заданного предела.';\n    }\n\n    var html = '';\n    html += row('Давление газа в затрубе на глубине ГЛМ', pBoth(res.pGasAt));\n    html += row('Гидростатика жидкости заканчивания', pBoth(res.pHydro));\n    html += row('Давление системы', pBoth(p.pSys));\n    html += row('Запас: газ − (гидростатика + система)', pBoth(res.margin(res.depth) + p.dP));\n    html += row('Градиент жидкости', nf3.format(res.Gl / PSI) + ' psi/м <span class=\"alt\">' + nf3.format(res.Gl) + ' кПа/м<\/span>');\n    html += row('Градиент газа в затрубе', nf3.format(res.gasGrad / PSI) + ' psi/м <span class=\"alt\">' + nf3.format(res.gasGrad) + ' кПа/м<\/span>');\n    if (res.pGasRequired !== undefined) {\n      html += row('Давление ГЛ, чтобы дойти до ' + nf0.format(p.dMax) + ' м', pBoth(res.pGasRequired));\n    }\n    var list = parseMandrels();\n    if (list.length) {\n      var m = E.pickMandrel(list, res.depth);\n      var txt = m.best === null\n        ? 'нет мандрели выше расчётной точки'\n        : '<b>' + nf0.format(m.best) + ' м<\/b> <span class=\"alt\">на ' + nf0.format(res.depth - m.best) + ' м выше расчётной<\/span>';\n      if (m.next !== null) txt += '<br><span class=\"alt\">следующая ' + nf0.format(m.next) + ' м — глубже предела<\/span>';\n      html += row('Подходящая установленная мандрель', txt);\n    }\n    table.innerHTML = html;\n    drawChart();\n  }\n\n  /* ---------- график ---------- */\n  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }\n  function niceStep(raw) {\n    var e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;\n    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;\n  }\n\n  function drawChart() {\n    var cv = $('chart'), dpr = window.devicePixelRatio || 1;\n    var w = cv.clientWidth, h = cv.clientHeight;\n    cv.width = w * dpr; cv.height = h * dpr;\n    var c = cv.getContext('2d');\n    c.setTransform(dpr, 0, 0, dpr, 0, 0);\n    c.clearRect(0, 0, w, h);\n    if (!last || last.res.depth === null) return;\n\n    var p = last.p, res = last.res, u = chartUnit;\n    var conv = function (k) { return fromKPa(k, u); };\n    var L = 62, R = 16, T = 14, B = 40;\n    var axisD = Math.max(res.depth * 1.35, 100);\n    var N = 80, pts = [], xmin = Infinity, xmax = -Infinity;\n    for (var i = 0; i <= N; i++) {\n      var D = axisD * i / N, a = conv(res.gasP(D)), b = conv(res.liqP(D));\n      pts.push({ D: D, a: a, b: b });\n      xmin = Math.min(xmin, a, b); xmax = Math.max(xmax, a, b);\n    }\n    xmin = Math.min(xmin, 0);\n    var step = niceStep((xmax - xmin) / 6);\n    xmin = Math.floor(xmin / step) * step; xmax = Math.ceil(xmax / step) * step;\n    var yStep = niceStep(axisD / 6), yMax = Math.ceil(axisD / yStep) * yStep;\n\n    function X(v) { return L + (v - xmin) / (xmax - xmin) * (w - L - R); }\n    function Y(d) { return T + d / yMax * (h - T - B); }\n\n    c.font = '12px -apple-system, \"Segoe UI\", sans-serif';\n    c.lineWidth = 1; c.strokeStyle = css('--c-grid'); c.fillStyle = css('--muted');\n    c.textAlign = 'center'; c.textBaseline = 'top';\n    for (var x = xmin; x <= xmax + 1e-9; x += step) {\n      c.beginPath(); c.moveTo(X(x), T); c.lineTo(X(x), h - B); c.stroke();\n      c.fillText(nf0.format(x), X(x), h - B + 6);\n    }\n    c.textAlign = 'right'; c.textBaseline = 'middle';\n    for (var y = 0; y <= yMax + 1e-9; y += yStep) {\n      c.beginPath(); c.moveTo(L, Y(y)); c.lineTo(w - R, Y(y)); c.stroke();\n      c.fillText(nf0.format(y), L - 8, Y(y));\n    }\n    c.textAlign = 'center'; c.textBaseline = 'bottom';\n    c.fillText('Давление, ' + u, L + (w - L - R) / 2, h - 4);\n    c.save(); c.translate(12, T + (h - T - B) / 2); c.rotate(-Math.PI / 2);\n    c.textBaseline = 'top'; c.fillText('Глубина TVD, м', 0, 0); c.restore();\n\n    function line(key, color) {\n      c.beginPath();\n      pts.forEach(function (q, i) { i ? c.lineTo(X(q[key]), Y(q.D)) : c.moveTo(X(q[key]), Y(q.D)); });\n      c.strokeStyle = color; c.lineWidth = 2.5; c.stroke();\n    }\n    line('a', css('--c-casing'));\n    line('b', css('--c-tubing'));\n\n    var px = X(conv(res.pGasAt)), py = Y(res.depth);\n    c.beginPath(); c.arc(px, py, 6, 0, 7);\n    c.fillStyle = css('--surface'); c.fill();\n    c.lineWidth = 3; c.strokeStyle = css('--ink'); c.stroke();\n    c.font = '600 12.5px -apple-system, \"Segoe UI\", sans-serif';\n    var label = nf0.format(res.depth) + ' м', tw = c.measureText(label).width;\n    var right = px > w * 0.6, lx = px + (right ? -12 - tw : 12);\n    c.fillStyle = css('--surface'); c.fillRect(lx - 4, py - 10, tw + 8, 20);\n    c.fillStyle = css('--ink'); c.textAlign = 'left'; c.textBaseline = 'middle';\n    c.fillText(label, lx, py);\n  }\n\n  document.querySelectorAll('#chartUnit button').forEach(function (b) {\n    b.addEventListener('click', function () {\n      chartUnit = b.dataset.u;\n      document.querySelectorAll('#chartUnit button').forEach(function (x) { x.classList.toggle('on', x === b); });\n      drawChart();\n    });\n  });\n  $('form').addEventListener('input', function (e) { if (e.target !== objSel) run(); });\n  window.addEventListener('resize', drawChart);\n  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawChart);\n  applyObject();\n  run();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n", "displacement": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Замещение затрубного пространства<\/title>\n<style>\n:root {\n  --bg: #f4f5f7;\n  --surface: #ffffff;\n  --ink: #1b2430;\n  --muted: #5d6b7c;\n  --line: #dfe3e8;\n  --accent: #0b6e99;\n  --accent-soft: #e3f1f7;\n  --ok: #17803d;\n  --ok-soft: #e1f4e8;\n  --warn: #a15c00;\n  --warn-soft: #fdf0d9;\n  --bad: #b3261e;\n  --bad-soft: #fbe4e2;\n  --c-casing: #0b6e99;\n  --c-open: #7aa9bd;\n  --c-tubing: #c2410c;\n  --c-grid: #e4e8ec;\n  --radius: 10px;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #12171d; --surface: #1b222b; --ink: #e6ebf0; --muted: #94a3b3; --line: #2b3541;\n    --accent: #5ab6dc; --accent-soft: #17323f; --ok: #5fcf88; --ok-soft: #173424;\n    --warn: #f0b252; --warn-soft: #3a2c12; --bad: #f2877f; --bad-soft: #3d1b19;\n    --c-casing: #5ab6dc; --c-open: #4f7e93; --c-tubing: #f08a5d; --c-grid: #26303a;\n  }\n}\n* { box-sizing: border-box; }\nbody {\n  margin: 0; background: var(--bg); color: var(--ink);\n  font: 15px/1.45 -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n}\na { color: var(--accent); }\n.topbar {\n  background: var(--surface); border-bottom: 1px solid var(--line);\n  display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 54px;\n  position: sticky; top: 0; z-index: 5;\n}\n.brand { font-weight: 700; letter-spacing: .2px; color: var(--ink); text-decoration: none; }\n.brand span { color: var(--accent); }\n. uted); margin-top: -2px; }\n.inp { display: flex; gap: 4px; }\ninput[type=number], input[type=text], select {\n  width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px;\n  background: var(--bg); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;\n}\ninput:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }\n.inp select { width: 66px; flex: none; padding: 7px 4px; }\n.inp input.has-unit { flex: 1; }\n.unit { align-self: center; color: var(--muted); font-size: 13px; width: 66px; flex: none; }\n.error { color: var(--bad); font-size: 12px; grid-column: 1 / -1; }\n\n/* result */\n.hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }\n.hero .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }\n.hero .big small { font-size: 18px; font-weight: 500; color: var(--muted); }\n.badge { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }\n.badge.ok { background: var(--ok-soft); color: var(--ok); }\n.badge.warn { background: var(--warn-soft); color: var(--warn); }\n.badge.bad { background: var(--bad-soft); color: var(--bad); }\n.note { margin: 10px 0 0; color: var(--muted); font-size: 13.5px; }\ntable.res { width: 100%; border-collapse: collapse; margin-top: 14px; font-variant-numeric: tabular-nums; }\ntable.res td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }\ntable.res td:first-child { color: var(--muted); padding-right: 12px; }\ntable.res td:last-child { text-align: right; font-weight: 500; }\ntable.res td .alt { color: var(--muted); font-weight: 400; margin-left: 8px; }\n.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }\n.seg button {\n  border: 0; background: var(--bg); color: var(--muted); padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer;\n}\n.seg button.on { background: var(--accent); color: #fff; }\n.chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }\n.chart-head h2 { margin: 0 !important; }\ncanvas { width: 100%; height: 440px; display: block; }\n.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }\n.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }\n.legend i.dash { border-top-style: dashed; }\ndetails.method { margin-top: 16px; font-size: 13.5px; color: var(--muted); }\ndetails.method summary { cursor: pointer; color: var(--ink); }\ndetails.method code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }\n\n/* ---- displacement module ---- */\n:root { --c-gas: #d97706; --c-brine: #0b6e99; --c-brine-soft: #a9cfe0; }\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --c-gas: #f5a524; --c-brine: #5ab6dc; --c-brine-soft: #2c4b5a; }\n}\n.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 14px; border-radius: 6px; font: inherit; font-size: 13.5px; cursor: pointer; }\n.btn:hover { border-color: var(--accent); }\n.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }\n.btn.small { padding: 3px 9px; font-size: 12.5px; }\n.sec-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 13px; }\n.sec-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 0 4px 4px 0; }\n.sec-table td { padding: 0 4px 4px 0; }\n.sec-table td:last-child { width: 28px; text-align: right; }\ntextarea { width: 100%; min-height: 110px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 12.5px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }\ntextarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }\n.msg { font-size: 12.5px; margin: 6px 0 0; color: var(--muted); }\n.msg.bad { color: var(--bad); }\n.msg.warn { color: var(--warn); }\n.viz { display: grid; grid-template-columns: 1fr 230px; gap: 16px; align-items: start; }\n@media (max-width: 700px) { .viz { grid-template-columns: 1fr; } }\ncanvas.tall { height: 560px; }\ncanvas.mid { height: 230px; }\n.readout { font-variant-numeric: tabular-nums; }\n.readout div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }\n.readout div:first-child { border-top: 0; }\n.readout span:first-child { color: var(--muted); }\n.readout b { font-weight: 600; text-align: right; }\n.controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }\n.controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }\n.controls select { width: auto; }\n.sched-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }\ntable.sched { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }\ntable.sched th, table.sched td { padding: 6px 10px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }\ntable.sched th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; }\ntable.sched td:first-child, table.sched th:first-child { text-align: left; }\ntable.sched .alt { color: var(--muted); }\n.legend i.sq { width: 14px; height: 14px; border: 0; border-radius: 3px; vertical-align: -2px; }\n\n[hidden] { display: none !important; }\n\n.grid > * { min-width: 0; }\n.viz > * { min-width: 0; }\n\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n  <a class=\"brand\" href=\"#index\">Well<span>Tools<\/span><\/a>\n  <nav class=\"nav\">\n    <a href=\"#gaslift\">Газлифт: глубина посадки<\/a>\n    <a class=\"active\" href=\"#displacement\">Замещение затрубного пространства<\/a>\n  <\/nav>\n<\/header>\n\n<main class=\"wrap\">\n  <h1>Замещение затрубного пространства<\/h1>\n  <p class=\"lead\">Газ из затруба постепенно вытесняет рассол через ГЛ клапан в НКТ. Расход рассола через клапан не должен превышать заданный предел (1 ббл/мин). Считаем ступенчатый график давления на устье по времени. Все давления — избыточные.<\/p>\n\n  <div class=\"grid\">\n    <form class=\"panel\" id=\"form\" autocomplete=\"off\" onsubmit=\"return false\">\n      <h2>Объект<\/h2>\n      <div class=\"field\">\n        <label for=\"obj\">Платформа<\/label>\n        <div class=\"inp\"><select id=\"obj\" style=\"width:100%\"><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pMax\">Макс. давление газлифта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pMax\" class=\"has-unit\" step=\"any\"><select data-pu=\"pMax\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"pSys\">Давление системы (выкидная линия)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"pSys\" class=\"has-unit\" step=\"any\"><select data-pu=\"pSys\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Берётся из объекта (пока временное значение).<\/div>\n      <\/div>\n\n      <h2>Рассол и ГЛМ<\/h2>\n      <div class=\"field\">\n        <label for=\"rho\">Плотность рассола (NaCl / KCl)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"rho\" value=\"9.0\" step=\"0.01\"><span class=\"unit\">ppg<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"L0\">Начальный уровень рассола (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"L0\" value=\"0\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">0 — затруб полностью заполнен рассолом.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"glmMd\">Глубина ГЛМ по стволу (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"glmMd\" value=\"1400\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"glmTvd\">Глубина ГЛМ по вертикали (TVD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"glmTvd\" value=\"1200\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\">Без инклинометрии ствол принимается прямым от устья до ГЛМ. С инклинометрией используется она, а это значение служит проверкой.<\/div>\n      <\/div>\n\n      <h2>Затрубное пространство<\/h2>\n      <table class=\"sec-table\">\n        <thead><tr><th>До MD, м<\/th><th>ID колонны, in<\/th><th>OD НКТ, in<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"secBody\"><\/tbody>\n      <\/table>\n      <button type=\"button\" class=\"btn small\" id=\"addSec\">+ секция<\/button>\n      <p class=\"msg\">Последняя секция действует до ГЛМ — «До MD» у неё можно не заполнять.<\/p>\n\n      <h2 style=\"margin-top:20px\">ГЛ клапан<\/h2>\n      <div class=\"field\">\n        <label for=\"vmode\">Характеристика клапана<\/label>\n        <div class=\"inp\"><select id=\"vmode\" style=\"width:100%\"><option value=\"port\">По диаметру порта<\/option><option value=\"dp\">По ΔP при макс. расходе<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"port\">\n        <label for=\"port\">Диаметр порта<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"port\" value=\"0.375\" step=\"0.001\"><span class=\"unit\">in<\/span><\/div>\n        <div class=\"hint\">Временное значение — уточните по паспорту клапана.<\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"port\">\n        <label for=\"cd\">Коэффициент расхода Cd<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"cd\" value=\"0.80\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\" data-v=\"dp\" hidden>\n        <label for=\"dpq\">ΔP на клапане при макс. расходе<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"dpq\" class=\"has-unit\" value=\"170\" step=\"any\"><select data-pu=\"dpq\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"qMax\">Макс. расход через клапан<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"qMax\" value=\"1\" step=\"0.01\"><span class=\"unit\">ббл/мин<\/span><\/div>\n      <\/div>\n\n      <h2>Перфорация НКТ (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"perfOn\">Учитывать перфорацию<\/label>\n        <div class=\"inp\"><input type=\"checkbox\" id=\"perfOn\" style=\"width:auto\"><\/div>\n        <div class=\"hint\">Отверстия в НКТ (выше или ниже ГЛМ) работают параллельно клапану: рассол уходит и через них. Ограничение расхода относится к клапану.<\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfMd\">Глубина перфорации (MD)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfMd\" value=\"1000\" step=\"any\"><span class=\"unit\">м<\/span><\/div>\n        <div class=\"hint\" id=\"perfTvd\"><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfN\">Количество отверстий<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfN\" value=\"4\" step=\"1\" min=\"1\"><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfD\">Диаметр отверстия<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfD\" value=\"1.0\" step=\"0.05\"><span class=\"unit\">см<\/span><\/div>\n      <\/div>\n      <div class=\"field\" data-perf hidden>\n        <label for=\"perfCd\">Коэффициент расхода Cd отверстий<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"perfCd\" value=\"0.80\" step=\"0.01\"><\/div>\n      <\/div>\n\n      <h2>График подачи<\/h2>\n      <div class=\"field\">\n        <label for=\"stepMin\">Длительность ступени<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"stepMin\" value=\"5\" step=\"any\"><span class=\"unit\">мин<\/span><\/div>\n        <div class=\"hint\">Меньше шаг — выше средний расход и быстрее замещение, но чаще переключения.<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"round\">Шаг уставки давления<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"round\" class=\"has-unit\" value=\"10\" step=\"any\"><select data-pu=\"round\"><option>psi<\/option><option>кПа<\/option><\/select><\/div>\n        <div class=\"hint\">Округляется вниз, чтобы не превысить расход.<\/div>\n      <\/div>\n\n      <h2>Газ и температура<\/h2>\n      <div class=\"field\">\n        <label for=\"gg\">Отн. плотность газа (воздух = 1)<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"gg\" value=\"0.70\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"z\">Коэффициент сверхсжимаемости Z<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"z\" value=\"0.90\" step=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"ts\">Температура на устье<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"ts\" value=\"20\" step=\"any\"><span class=\"unit\">°C<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"tg\">Геотермический градиент<\/label>\n        <div class=\"inp\"><input type=\"number\" id=\"tg\" value=\"3\" step=\"0.1\"><span class=\"unit\">°C/100 м<\/span><\/div>\n      <\/div>\n\n      <h2>Инклинометрия (необязательно)<\/h2>\n      <div class=\"field\">\n        <label for=\"sfmt\">Формат данных<\/label>\n        <div class=\"inp\"><select id=\"sfmt\" style=\"width:100%\"><option value=\"incaz\">MD, угол, азимут<\/option><option value=\"mdtvd\">MD, TVD<\/option><\/select><\/div>\n      <\/div>\n      <textarea id=\"survey\" placeholder=\"Вставьте таблицу из Excel: по строке на точку, разделитель — пробел, Tab или ;\"><\/textarea>\n      <p class=\"msg\" id=\"surveyMsg\"><\/p>\n      <button type=\"button\" class=\"btn small\" id=\"demo\">Вставить пример<\/button>\n    <\/form>\n\n    <div>\n      <section class=\"panel\" aria-live=\"polite\">\n        <h2>Результат<\/h2>\n        <div class=\"hero\">\n          <div class=\"big\" id=\"time\">—<\/div>\n          <span class=\"badge\" id=\"badge\"><\/span>\n        <\/div>\n        <p class=\"note\" id=\"note\"><\/p>\n        <table class=\"res\" id=\"table\"><\/table>\n      <\/section>\n\n      <section class=\"panel\">\n        <h2>График подачи давления<\/h2>\n        <canvas id=\"chartP\" class=\"mid\"><\/canvas>\n        <div class=\"chart-head\" style=\"margin-top:12px\">\n          <h2 style=\"margin:0\">Расход через клапан<\/h2>\n          <div class=\"seg\" id=\"chartUnit\"><button data-u=\"psi\" class=\"on\">psi<\/button><button data-u=\"кПа\">кПа<\/button><\/div>\n        <\/div>\n        <canvas id=\"chartQ\" class=\"mid\"><\/canvas>\n        <div class=\"legend\">\n          <span><i style=\"border-color:var(--c-tubing)\"><\/i>Через клапан<\/span>\n          <span id=\"legPerf\" hidden><i style=\"border-color:var(--c-casing)\"><\/i>Через перфорацию НКТ<\/span>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\">\n        <h2>Путь газа<\/h2>\n        <div class=\"viz\">\n          <canvas id=\"viz\" class=\"tall\"><\/canvas>\n          <div>\n            <div class=\"readout\" id=\"readout\"><\/div>\n            <div class=\"legend\" style=\"flex-direction:column;margin-top:14px\">\n              <span><i class=\"sq\" style=\"background:var(--c-gas)\"><\/i>Газ<\/span>\n              <span><i class=\"sq\" style=\"background:var(--c-brine)\"><\/i>Рассол, вытесняется<\/span>\n              <span><i class=\"sq\" style=\"background:var(--c-brine-soft)\"><\/i>Рассол ниже ГЛМ<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"controls\">\n          <button type=\"button\" class=\"btn primary\" id=\"play\">▶ Пуск<\/button>\n          <input type=\"range\" id=\"scrub\" min=\"0\" max=\"100\" step=\"0.1\" value=\"0\" aria-label=\"Время\">\n          <select id=\"speed\" aria-label=\"Скорость\"><option value=\"30\">30 с<\/option><option value=\"15\">15 с<\/option><option value=\"60\">60 с<\/option><\/select>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\">\n        <div class=\"chart-head\">\n          <h2>Таблица ступеней<\/h2>\n          <div><button type=\"button\" class=\"btn small\" id=\"csv\">Скачать CSV<\/button><\/div>\n        <\/div>\n        <div class=\"sched-wrap\"><table class=\"sched\" id=\"sched\"><\/table><\/div>\n        <details class=\"method\">\n          <summary>Как считается<\/summary>\n          <p>Рассол из затруба уходит через клапан в НКТ, а НКТ открыта на выкидную линию. Перепад на клапане: <code>ΔP = Pг(Dур) − Pсист − Gб·Dур<\/code>, где Pг — давление газа на уровне рассола (по TVD уровня, с учётом сжимаемости), Gб·Dур — гидростатика рассола.<\/p>\n          <p>Расход: <code>q = k·√ΔP<\/code>, <code>k = Cd·A·√(2/ρ)<\/code>. Начало каждой ступени: давление подбирается так, чтобы q = qmax, и округляется вниз. Пока ступень идёт, уровень опускается, ΔP и расход падают; затем давление поднимается. Расход не превышает qmax ни в какой момент.<\/p>\n          <p>Перфорация НКТ: расход через отверстия <code>qп = Cd·N·Aотв·√(2ΔP/ρ)<\/code>. Пока затруб и НКТ заполнены рассолом, перепад на перфорации равен перепаду на клапане (на любой глубине), поэтому график давления остаётся прежним, а уровень опускается быстрее (по сумме расходов). Перфорация ниже ГЛМ работает весь путь вытеснения, расчёт заканчивается на ГЛМ. Перфорация выше ГЛМ: когда уровень дошёл до неё, газ выходит в НКТ и расчёт заканчивается; рассол ниже в расчёте не вытесняется, его объём показан в результате.<\/p>\n          <p>Скорость опускания уровня: <code>q / ёмкость затруба<\/code> (ёмкость по MD из диаметров колонны и НКТ). Замещение закончено, когда уровень дошёл до ГЛМ по MD, дальше ограничение на газ не действует.<\/p>\n        <\/details>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\n/* Объекты: максимальное давление газлифта и давление системы (выкидная линия / сепаратор), psi.\n * ВАЖНО: pSystemPsi — временные значения (1000 psi), ждут уточнения от инженера. */\nwindow.GL_OBJECTS = [\n  { id: 'berkut', name: 'МСП Беркут',  pGasMaxPsi: 3000, pSystemPsi: 1000 },\n  { id: 'odoptu', name: 'БКП Одопту',  pGasMaxPsi: 2500, pSystemPsi: 1000 },\n  { id: 'orlan',  name: 'МСП Орлан',   pGasMaxPsi: 2900, pSystemPsi: 1000 }\n];\n\n<\/script>\n<script>\n/* Расчётное ядро: замещение рассола в затрубе газом через ГЛ клапан (ГЛМ) с ограничением расхода.\n *\n * Модель (квазистатическая, давления избыточные, внутри — кПа):\n *   - НКТ заполнена рассолом и открыта на выкидную линию (давление системы Pсист).\n *   - Газ закачивается в затруб с устья; уровень рассола в затрубе опускается, рассол уходит через клапан в НКТ.\n *   - Перепад на клапане:  ΔPкл = Pг(Dур) − Pсист − Gб·Dур,\n *       Pг(Dур) — давление газа на уровне рассола (по TVD уровня), Gб·Dур — гидростатика рассола.\n *     (столб рассола между уровнем и ГЛМ в затрубе и в НКТ взаимно уравновешивается)\n *   - Расход через клапан  q = k·√ΔPкл  (форма «отверстие»):\n *       k = Cd·A·√(2/ρ)  по диаметру порта, либо из известного ΔP при максимальном расходе.\n *   - Уставки давления подаются ступенями: в начале ступени давление такое, что q = qmax (округляется вниз),\n *     в течение ступени уровень опускается, ΔPкл и расход падают, затем давление поднимается на следующую ступень.\n *     Расход никогда не превышает qmax.\n *   - Рассол вытеснен, когда уровень дошёл до ГЛМ (по MD) — дальше ограничение на газ не распространяется.\n *   - Перфорация НКТ (необязательно) — параллельный путь рассола, k = Cd·N·A·√(2/ρ). Пока затруб и НКТ заполнены рассолом,\n *     перепад на ней равен перепаду на клапане. Если она выше ГЛМ, расчёт заканчивается выходом газа в НКТ на ней.\n */\n(function (root) {\n  'use strict';\n\n  var PSI = 6.894757, ATM = 101.325;\n  var BBL_M3 = 0.158987294928;\n  var PPG = 1.17512;        // 1 ppg → кПа/м\n  var PPG_KGM3 = 119.8264;  // 1 ppg → кг/м³\n  var IN = 0.0254;\n\n  /* ---------- инклинометрия ---------- */\n\n  function parseNumbers(text) {\n    var rows = [];\n    text.split(/\\r?\\n/).forEach(function (line) {\n      var t = line.trim();\n      if (!t) return;\n      var cells = t.split(/[;\\t ]+/).map(function (s) { return parseFloat(s.replace(',', '.')); });\n      if (!isFinite(cells[0])) return;           // заголовок или мусор\n      rows.push(cells);\n    });\n    return rows;\n  }\n\n  /* fmt: 'incaz' — MD, зенитный угол (°), азимут (°);  'mdtvd' — MD, TVD */\n  function parseSurvey(text, fmt) {\n    var rows = parseNumbers(text);\n    if (!rows.length) return { pts: null };\n    var need = fmt === 'mdtvd' ? 2 : 3;\n    for (var i = 0; i < rows.length; i++) {\n      for (var j = 0; j < need; j++) {\n        if (!isFinite(rows[i][j])) return { error: 'Строка ' + (i + 1) + ': нужно ' + need + ' числа (' + (fmt === 'mdtvd' ? 'MD, TVD' : 'MD, угол, азимут') + ').' };\n      }\n      if (i > 0 && rows[i][0] <= rows[i - 1][0]) return { error: 'MD должен строго возрастать (строка ' + (i + 1) + ').' };\n    }\n    var pts = [];\n    if (fmt === 'mdtvd') {\n      if (rows[0][0] > 0) rows.unshift([0, 0]);\n      var dep = 0;\n      rows.forEach(function (r, i) {\n        if (i > 0) {\n          var dm = r[0] - rows[i - 1][0], dt = r[1] - rows[i - 1][1];\n          if (dt > dm + 1e-6) throw new Error('TVD растёт быстрее MD (строка ' + (i + 1) + ').');\n          dep += Math.sqrt(Math.max(dm * dm - dt * dt, 0));\n        }\n        pts.push({ md: r[0], tvd: r[1], dep: dep });\n      });\n    } else {\n      if (rows[0][0] > 0) rows.unshift([0, rows[0][1], rows[0][2]]);\n      var tvd = 0, N = 0, Ee = 0, R = Math.PI / 180;\n      rows.forEach(function (r, i) {\n        if (i > 0) {\n          var p = rows[i - 1], dm = r[0] - p[0];\n          var I1 = p[1] * R, I2 = r[1] * R, A1 = p[2] * R, A2 = r[2] * R;\n          var c = Math.cos(I2 - I1) - Math.sin(I1) * Math.sin(I2) * (1 - Math.cos(A2 - A1));\n          var DL = Math.acos(Math.max(-1, Math.min(1, c)));\n          var RF = DL < 1e-6 ? 1 : 2 / DL * Math.tan(DL / 2);\n          tvd += dm / 2 * (Math.cos(I1) + Math.cos(I2)) * RF;\n          N += dm / 2 * (Math.sin(I1) * Math.cos(A1) + Math.sin(I2) * Math.cos(A2)) * RF;\n          Ee += dm / 2 * (Math.sin(I1) * Math.sin(A1) + Math.sin(I2) * Math.sin(A2)) * RF;\n        }\n        pts.push({ md: r[0], tvd: tvd, dep: Math.sqrt(N * N + Ee * Ee) });\n      });\n    }\n    return { pts: pts };\n  }\n\n  /* профиль ствола: интерполяция MD → TVD / отход; за последней точкой — продолжение по последнему интервалу */\n  function makeProfile(survey, glmMd, glmTvd) {\n    var pts = survey && survey.length >= 2 ? survey :\n      [{ md: 0, tvd: 0, dep: 0 }, { md: glmMd, tvd: Math.min(glmTvd, glmMd), dep: Math.sqrt(Math.max(glmMd * glmMd - glmTvd * glmTvd, 0)) }];\n    function seg(md) {\n      var n = pts.length;\n      if (md <= pts[0].md) return 1;\n      if (md >= pts[n - 1].md) return n - 1;\n      var lo = 1, hi = n - 1;\n      while (lo < hi) { var m = (lo + hi) >> 1; if (pts[m].md >= md) hi = m; else lo = m + 1; }\n      return lo;\n    }\n    function at(md, key) {\n      var i = seg(md), a = pts[i - 1], b = pts[i];\n      return a[key] + (b[key] - a[key]) * (md - a.md) / (b.md - a.md);\n    }\n    return {\n      pts: pts,\n      tvdAt: function (md) { return md <= 0 ? 0 : at(md, 'tvd'); },\n      depAt: function (md) { return md <= 0 ? 0 : at(md, 'dep'); }\n    };\n  }\n\n  /* ---------- геометрия затрубья ---------- */\n  /* sections: [{ toMd, dc, dt }] — дюймы; последняя секция действует до конца */\n  function makeCapacity(sections) {\n    var s = sections.slice().sort(function (a, b) { return (a.toMd === null ? 1e12 : a.toMd) - (b.toMd === null ? 1e12 : b.toMd); });\n    return function (md) {    /      pSys: toKPa(need('pSys', 'Давление системы', function (v) { return v >= 0; }), unitOf('pSys')),\n      pMax: toKPa(need('pMax', 'Макс. давление ГЛ', function (v) { return v > 0; }), unitOf('pMax')),\n      L0: need('L0', 'Начальный уровень', function (v) { return v >= 0 && v < glmMd; }),\n      qMax: need('qMax', 'Макс. расход', function (v) { return v > 0; }),\n      stepMin: need('stepMin', 'Длительность ступени', function (v) { return v > 0 && v <= 120; }),\n      roundKpa: toKPa(need('round', 'Шаг уставки', function (v) { return v >= 0; }), unitOf('round')),\n      gg: need('gg', 'Плотность газа', function (v) { return v > 0.2 && v < 2; }),\n      z: need('z', 'Z', function (v) { return v > 0.3 && v < 1.5; }),\n      ts: need('ts', 'Температура на устье'),\n      tg: need('tg', 'Геотермический градиент'),\n      valve: vmode === 'port'\n        ? { mode: 'port', portIn: need('port', 'Диаметр порта', function (v) { return v > 0; }), cd: need('cd', 'Cd', function (v) { return v > 0 && v <= 1; }) }\n        : { mode: 'dp', dpAtQmax: toKPa(need('dpq', 'ΔP клапана', function (v) { return v > 0; }), unitOf('dpq')) }\n    };\n    return { p: p, errs: errs };\n  }\n\n  function row(k, v) { return '<tr><td>' + k + '<\/td><td>' + v + '<\/td><\/tr>'; }\n  function bblBoth(b) { return nf1.format(b) + ' ббл <span class=\"alt\">' + nf1.format(b * BBL) + ' м³<\/span>'; }\n\n  /* ---------- расчёт и вывод ---------- */\n  function run() {\n    var r = readParams();\n    var badge = $('badge'), time = $('time'), note = $('note'), table = $('table');\n    if (r.errs.length) {\n      time.innerHTML = '—';\n      badge.className = 'badge bad'; badge.textContent = 'Проверьте ввод';\n      note.textContent = 'Некорректные поля: ' + r.errs.join('; ') + '.';\n      table.innerHTML = ''; $('sched').innerHTML = ''; $('readout').innerHTML = '';\n      last = null; stopPlay(); drawAll();\n      return;\n    }\n    var p = r.p, res = E.calc(p);\n    last = { p: p, res: res };\n    $('s до ГЛМ';\n      note.textContent = 'При максимальном давлении ГЛ уровень рассола остановится на ' + nf0.format(res.level) + ' м MD (' + nf0.format(res.levelTvd) + ' м TVD). Нужно давление выше или рассол легче.';\n    } else {\n      time.innerHTML = '—';\n      badge.className = 'badge bad'; badge.textContent = 'Расчёт не завершён';\n      note.textContent = 'Замещение не завершилось за 5000 мин. Проверьте характеристику клапана.';\n    }\n\n    var avgQ = res.vol / Math.max(res.totalTime, 1e-9);\n    var html = '';\n    html += row('Ступеней давления', nf0.format(res.steps.length));\n    html += row('Давление на устье: первая ступень', pBoth(res.firstPs));\n    html += row('Давление на устье: последняя ступень', pBoth(res.finalPs));\n    html += row('Макс. давление ГЛ объекта', pBoth(p.pMax) + (res.finalPs > p.pMax - 1 ? ' <span class=\"alt\">достигнут предел<\/span>' : ''));\n    html += row('Вытеснено рассола', bblBoth(res.vol));\n    html += row(res.perfAbove ? 'Объём затруба до перфорации' : 'Объём затруба до ГЛМ', bblBoth(res.totalVol));\n    html += row('Расход через клапан: максимум' + (res.perf ? '' : ' / средний'),\n      nf2.format(res.qMaxSeen) + (res.perf ? '' : ' / ' + nf2.format(avgQ)) + ' ббл/мин');\n    if (res.perf) {\n      html += row('Расход через перфорацию: максимум', nf2.format(res.qpMax) + ' ббл/мин');\n      html += row('Суммарный расход: максимум / средний', nf2.format(res.qtMax) + ' / ' + nf2.format(avgQ) + ' ббл/мин');\n      html += row('Пропускная способность перфорации / клапана', nf1.format(res.kp / res.k) + ' : 1');\n    }\n    html += row('ΔP на клапане при ' + nf2.format(p.qMax) + ' ббл/мин', pBoth(res.dpStar));\n    table.innerHTML = html;\n\n    renderSchedule(res);\n    drawAll();\n  }\n\n  function renderSchedule(res) {\n    var hasPerf = !!res.perf;\n    var h = '<thead><tr><th>№<\/th><th>Время, мин<\/th><th>Давление, psi<\/th><th>Давление, кПа<\/th><th>Уровень MD, м<\/th><th>Уровень TVD, м<\/th><th>Клапан нач → кон, ббл/мин ion stateAt(t) {\n    var tr = last.res.trace, lo = 0, hi = tr.length - 1;\n    if (t <= tr[0].t) return tr[0];\n    if (t >= tr[hi].t) return tr[hi];\n    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (tr[m].t <= t) lo = m; else hi = m; }\n    var a = tr[lo], b = tr[hi], f = (t - a.t) / (b.t - a.t || 1);\n    return { t: t, L: a.L + (b.L - a.L) * f, ps: a.ps, q: a.q + (b.q - a.q) * f, qp: (a.qp || 0) + ((b.qp || 0) - (a.qp || 0)) * f, vol: a.vol + (b.vol - a.vol) * f };\n  }\n\n  /* ---------- графики ---------- */\n  function setupCanvas(cv) {\n    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;\n    cv.width = Math.max(1, w * dpr); cv.height = Math.max(1, h * dpr);\n    var c = cv.getContext('2d');\n    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);\n    return { c: c, w: w, h: h };\n  }\n\n  function plot(cv, o) {\n    var s = setupCanvas(cv), c = s.c, w = s.w, h = s.h;\n    var L = 62, R = 16, T = 12, B = 38;\n    var xs = niceStep(o.xmax / 6), ys = niceStep(o.ymax / 4);\n    var xM = Math.ceil(o.xmax / xs - 1e-9) * xs, yM = Math.ceil(o.ymax / ys - 1e-9) * ys;\n    function X(v) { return L + v / xM * (w - L - R); }\n    function Y(v) { return T + (1 - v / yM) * (h - T - B); }\n    c.font = '12px -apple-system, \"Segoe UI\", sans-serif';\n    c.lineWidth = 1; c.strokeStyle = css('--c-grid'); c.fillStyle = css('--muted');\n    c.textAlign = 'center'; c.textBaseline = 'top';\n    for (var x = 0; x <= xM + 1e-9; x += xs) {\n      c.beginPath(); c.moveTo(X(x), T); c.lineTo(X(x), h - B); c.stroke(); c.fillText(nf0.format(x), X(x), h - B + 6);\n    }\n    c.textAlign = 'right'; c.textBaseline = 'middle';\n    for (var y = 0; y <= yM + 1e-9; y += ys) {\n      c.beginPath(); c.moveTo(L, Y(y)); c.lineTo(w - R, Y(y)); c.stroke(); c.fillText(o.fmt(y), L - 8, Y(y));\n    }\n    c.textAlign = 'center'; c.textBaseline = 'bottom';\n    c.fillText('Время, мин', L + (w - L - R) / 2, h - 2);\n    c.save(); c.translate(12, T + (h - T - B) / 2); c.rotate(-Math.PI / 2); c.textBaseline = 'top'; c.fillText(o.ylabel, 0, 0); c.restore();\n\n    (o.hlines || []).forEach(function (hl) {\n      c.setLineDash([6, 4]); c.strokeStyle = hl.color; c.lineWidth = 1.5;\n      c.beginPath(); c.moveTo(L, Y(hl.y)); c.lineTo(w - R, Y(hl.y)); c.stroke(); c.setLineDash([]);\n      c.fillStyle = hl.color; c.textAlign = 'right'; c.textBaseline = 'bottom';\n      c.fillText(hl.label, w - R - 4, Y(hl.y) - 3);\n    });\n    o.series.forEach(function (sr) {\n      c.beginPath();\n      sr.pts.forEach(function (q, i) { i ? c.lineTo(X(q[0]), Y(q[1])) : c.moveTo(X(q[0]), Y(q[1])); });\n      c.strokeStyle = sr.color; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();\n    });\n    if (o.cursor !== null && o.cursor !== undefined) {\n      c.strokeStyle = css('--ink'); c.lineWidth = 1.5; c.setLineDash([3, 3]);\n      c.beginPath(); c.moveTo(X(o.cursor), T); c.lineTo(X(o.cursor), h - B); c.stroke(); c.setLineDash([]);\n      if (o.cursorY !== undefined) {\n        c.beginPath(); c.arc(X(o.cursor), Y(o.cursorY), 5, 0, 7);\n        c.fillStyle = css('--surface'); c.fill(); c.lineWidth = 2.5; c.strokeStyle = css('--ink'); c.stroke();\n      }\n    }\n  }\n\n  function drawCharts() {\n    if (!last) { setupCanvas($('chartP')); setupCanvas($('chartQ')); return; }\n    var p = last.p, res = last.res, u = chartUnit, conv = function (k) { return fromKPa(k, u); };\n    var st = stateAt(tcur);\n    var pts = [];\n    res.steps.forEach(function (s) { pts.push([s.t0, conv(s.ps)]); pts.push([s.t1, conv(s.ps)]); });\n    var tEnd = Math.max(res.totalTime, 1);\n    plot($('chartP'), {\n      xmax: tEnd, ymax: Math.max(conv(p.pMax), conv(res.finalPs)) * 1.08, ylabel: 'Давление на устье, ' + u,\n      fmt: function (v) { return nf0.format(v); },\n      series: [{ pts: pts, color: css('--c-casing') }],\n      hlines: [{ y: conv(p.pMax), color: css('--muted'), label: 'макс. ГЛ ' + nf0.format(conv(p.pMax)) }],\n      cursor: tcur, cursorY: conv(st.ps || res.steps[0].ps)\n    });\n    var qpts = res.trace.map(function (r) { return [r.t, r.q]; });\n    var series = [{ pts: qpts, color: css('--c-tubing') }];\n    if (res.perf) series.push({ pts: res.trace.map(function (r) { return [r.t, r.qp || 0]; }), color: css('--c-casing') });\n    $('legPerf').hidden = !res.perf;\n    plot($('chartQ'), {\n      xmax: tEnd, ymax: Math.max(p.qMax * 1.25, res.perf ? res.qpMax * 1.1 : 0), ylabel: 'Расход, ббл/мин',\n      fmt: function (v) { return nf2.format(v); },\n      series: series,\n      hlines: [{ y: p.qMax, color: css('--bad'), label: 'предел клапана ' + nf2.format(p.qMax) }],\n      cursor: tcur, cursorY: st.q\n    });\n  }\n\n  /* ---------- схема: путь газа ---------- */\n  function drawViz() {\n    var s = setupCanvas($('viz')), c = s.c, w = s.w, h = s.h;\n    if (!last) return;\n    var p = last.p, res = last.res, prof = p.profile, st = stateAt(tcur);\n    var mdEnd = Math.max(p.glmMd, p.perf ? p.perf.md : 0) + Math.max(60, p.glmMd * 0.08);\n    var tvdMax = prof.tvdAt(mdEnd), depMax = prof.depAt(mdEnd);\n    var Lm = 52, Rm = 16, Tm = 26, Bm = 16;\n    var sc = Math.min((w - Lm - Rm - 90) / Math.max(depMax, 1), (h - Tm - Bm) / tvdMax);\n    var x0 = Lm + 14 + Math.max(0, (w - Lm - Rm - 90 - depMax * sc) / 2);\n    function PX(md) { return x0 + prof.depAt(md) * sc; }\n    function PY(md) { return Tm + prof.tvdAt(md) * sc; }\n\n    // сетка по TVD\n    var ts = niceStep(tvdMax / 6);\n    c.font = '12px -apple-system, \"Segoe UI\", sans-serif'; c.lineWidth = 1;\n    c.textAlign = 'right'; c.textBaseline = 'middle';\n    for (var d = 0; d <= tvdMax; d += ts) {\n      var yy = Tm + d * sc;\n      c.strokeStyle = css('--c-grid'); c.beginPath(); c.moveTo(Lm, yy); c.lineTo(w - Rm, yy); c.stroke();\n      c.fillStyle = css('--muted'); c.fillText(nf0.format(d), Lm - 8, yy);\n    }\n    c.save(); c.translate(10, Tm + tvdMax * sc / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.textBaseline = 'top';\n    c.fillStyle = css('--muted'); c.fillText('TVD, м', 0, 0); c.restore();\n\n    function path(md0, md1, width, color, cap) {\n      if (md1 <= md0) return;\n      c.beginPath();\n      var n = Math.max(2, Math.ceil((md1 - md0) / 4));\n      for (var i = 0; i <= n; i++) {\n        var md = md0 + (md1 - md0) * i / n;\n        i ? c.lineTo(PX(md), PY(md)) : c.moveTo(PX(md), PY(md));\n      }\n      c.lineWidth = width; c.strokeStyle = color; c.lineCap = cap || 'butt'; c.lineJoin = 'round'; c.stroke();\n    }\n    path(0, mdEnd, 22, css('--line'), 'round');                     // колонна\n    path(p.glmMd, mdEnd, 15, css('--c-brine-soft'));                // рассол ниже ГЛМ\n    path(st.L, p.glmMd, 15, css('--c-brine'));                       // рассол, который вытесняется\n    path(0, st.L, 15, css('--c-gas'));                               // газ\n    path(0, p.perf && p.perf.md > p.glmMd ? p.perf.md : p.glmMd, 3, css('--ink'));   // НКТ\n\n    // устье\n    c.fillStyle = css('--ink'); c.fillRect(PX(0) - 14, PY(0) - 8, 28, 5);\n    c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = '600 12px -apple-system, \"Segoe UI\", sans-serif';\n    c.fillText('Устье', PX(0) + 20, PY(0) - 6);\n\n    function tag(text, x, y, color, right) {\n      var tw = c.measureText(text).width, lx = right ? x - 14 - tw : x + 14;\n      c.fillStyle = css('--surface'); c.fillRect(lx - 4, y - 10, tw + 8, 20);\n      c.fillStyle = color; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, lx, y);\n    }\n    // ГЛМ\n    var gx = PX(p.glmMd), gy = PY(p.glmMd);\n    c.fillStyle = css('--surface'); c.strokeStyle = css('--ink'); c.lineWidth = 2.5;\n    c.beginPath(); c.rect(gx - 8, gy - 8, 16, 16); c.fill(); c.stroke();\n    tag('ГЛМ  ' + nf0.format(p.glmMd) + ' м MD / ' + nf0.format(prof.tvdAt(p.glmMd)) + ' м TVD', gx, gy + 24, css('--ink'), gx > w * 0.55);\n\n    // перфорация НКТ\n    var target = res.Lend;\n    if (res.perf) {\n      var qx = PX(res.perf.md), qy = PY(res.perf.md);\n      c.beginPath(); c.moveTo(qx, qy - 9); c.lineTo(qx + 9, qy); c.lineTo(qx, qy + 9); c.lineTo(qx - 9, qy); c.closePath();\n      c.fillStyle = css('--surface'); c.fill(); c.lineWidth = 2.5; c.strokeStyle = css('--ink'); c.stroke();\n      if (st.L >= target - 0.5) {   // газ вошёл в НКТ через перфорацию\n        path(0, target, 5, css('--c-gas'));\n        path(0, target, 1.5, css('--ink'));\n      }\n      tag('перфорация ' + nf0.format(res.perf.md) + ' м MD · ' + res.perf.n + ' × ⌀' + nf1.format(res.perf.dCm) + ' см', qx, qy + (res.perfAbove ? -22 : 22), css('--ink'), qx > w * 0.55);\n    }\n\n    // уровень рассола / фронт газа\n    if (st.L < target - 0.5) {\n      var lx_ = PX(st.L), ly_ = PY(st.L);\n      c.beginPath(); c.arc(lx_, ly_, 6, 0, 7); c.fillStyle = css('--surface'); c.fill();\n      c.lineWidth = 3; c.strokeStyle = css('--c-gas'); c.stroke();\n      tag('уровень ' + nf0.format(st.L) + ' м MD', lx_, ly_, css('--ink'), lx_ > w * 0.55);\n    } else if (res.status !== 'perf') {\n      tag('газ у ГЛМ', gx, gy - 20, css('--c-gas'), gx > w * 0.55);\n    } else {\n      tag('газ в НКТ', PX(target), PY(target) + 22, css('--c-gas'), PX(target) > w * 0.55);\n    }\n    $('readout').innerHTML = readoutHtml(st);\n  }\n\n  function readoutHtml(st) {\n    var res = last.res, prof = last.p.profile;\n    function r(k, v) { return '<div><span>' + k + '<\/span><b>' + v + '<\/b><\/div>'; }\n    var done = st.L >= res.Lend - 0.5;\n    return r('Время', nf1.format(st.t) + ' мин') +\n      r('Давление на устье', nf0.format((st.ps || res.steps[0].ps) / PSI) + ' psi<br>' + nf0.format(st.ps || res.steps[0].ps) + ' кПа') +\n      r('Уровень рассола', nf0.format(st.L) + ' м MD<br>' + nf0.format(prof.tvdAt(st.L)) + ' м TVD') +\n      r('Расход через клапан', nf2.format(st.q) + ' ббл/мин') +\n      (res.perf ? r('Расход через перфорацию', nf2.format(st.qp) + ' ббл/мин') : '') +\n      r('Вытеснено', nf1.format(st.vol) + ' ббл<br>' + nf1.format(st.vol * BBL) + ' м³') +\n      r('Состояние', done ? (res.status === 'reached' ? 'газ у ГЛМ' : res.status === 'perf' ? 'газ в НКТ' : 'остановка') : 'вытеснение');\n  }\n\n  function drawAll() { drawCharts(); drawViz(); }\n\n  /* ---------- анимация ---------- */\n  var scrub = $('scrub'), playBtn = $('play');\n  function setT(t) { tcur = t; scrub.value = t; drawAll(); }\n  function stopPlay() { playing = false; cancelAnimationFrame(rafId); playBtn.textContent = '▶ Пуск'; }\n  function tick(ts) {\n    if (!playing || !last) return;\n    var dt = (ts - lastTs) / 1000; lastTs = ts;\n    var total = last.res.totalTime, dur = parseFloat($('speed').value);\n    var t = tcur + dt * total / dur;\n    if (t >= total) { setT(total); stopPlay(); return; }\n    setT(t);\n    rafId = requestAnimationFrame(tick);\n  }\n  playBtn.addEventListener('click', function () {\n    if (!last) return;\n    if (playing) { stopPlay(); return; }\n    if (tcur >= last.res.totalTime - 1e-6) tcur = 0;\n    playing = true; playBtn.textContent = '❚❚ Пауза'; lastTs = performance.now();\n    rafId = requestAnimationFrame(tick);\n  });\n  scrub.addEventListener('input', function () { stopPlay(); setT(parseFloat(scrub.value)); });\n\n  document.querySelectorAll('#chartUnit button').forEach(function (b) {\n    b.addEventListener('click', function () {\n      chartUnit = b.dataset.u;\n      document.querySelectorAll('#chartUnit button').forEach(function (x) { x.classList.toggle('on', x === b); });\n      drawCharts();\n    });\n  });\n\n  $('form').addEventListener('input', function (e) { if (e.target !== objSel && e.target.id !== 'vmode') { stopPlay(); run(); } });\n  window.addEventListener('resize', drawAll);\n  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawAll);\n  applyObject(); syncValve(); syncPerf(); run();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"}</script>
<script>
(function () {
  var pages = JSON.parse(document.getElementById('pages').textContent);
  var frame = document.getElementById('app');
  function current() { var h = location.hash.slice(1); return pages[h] ? h : 'index'; }
  function show() {
    var name = current();
    if (frame.dataset.page === name) return;
    frame.dataset.page = name;
    frame.srcdoc = pages[name];
  }
  frame.addEventListener('load', function () {
    var d = frame.contentDocument;
    if (!d) return;
    document.title = d.title || 'WellTools';
    d.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var name = a.getAttribute('href').slice(1);
      if (pages[name]) location.hash = name;
    });
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
